<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffd9b8">
<title>COZVIL</title>
<style>
:root{
  --bg:#fdf1dc;--ink:#5a3b2e;--ink2:#9a7762;--panel:#fffaf0;--edge:#f2d9b0;--shade:#e7c791;
  --pink:#ff8fa8;--pink2:#e86a8a;--teal:#5ccfc0;--teal2:#33b0a2;--sky:#6cc3ff;--sky2:#3a9fe6;
  --sun:#ffcf5c;--sun2:#eaa92c;--lilac:#b79cff;--lilac2:#8f72e6;--good:#6bd17f;--good2:#43b45d;--bad:#ff7a85;--bad2:#e0505e;
  --font:"Fredoka","Nunito","Varela Round",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:linear-gradient(160deg,#ffe3c2,#ffd0da 55%,#e6d4ff);font-family:var(--font);color:var(--ink);overflow:hidden}
#app{position:relative;width:100%;max-width:430px;height:100dvh;max-height:940px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:500px) and (min-height:700px){#app{margin-top:calc((100dvh - min(100dvh,940px))/2);border-radius:34px;box-shadow:0 20px 60px rgba(120,60,40,.25),0 0 0 8px #fff7;}}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
/* header */
#top{flex:none;display:flex;align-items:center;gap:5px;padding:8px 8px 6px;background:linear-gradient(#fff6e6,#ffeccb);border-bottom:3px solid var(--edge);z-index:5}
.chip{display:flex;align-items:center;gap:4px;padding:3px 9px 3px 5px;border-radius:99px;background:#fff;border:2px solid var(--edge);font-weight:600;font-size:14px;line-height:1.1;box-shadow:0 2px 0 var(--shade);white-space:nowrap;transition:transform .15s}
.chip .em{font-size:17px}
.chip.bump{animation:bump .35s}
.chip.full{border-color:var(--bad);color:var(--bad2)}
#top .chip{flex:1;justify-content:center;min-width:0;padding:3px 4px}
#gear{flex:none;width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid var(--edge);box-shadow:0 2px 0 var(--shade);font-size:19px;display:grid;place-items:center}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
/* screens */
main{flex:1;position:relative;min-height:0}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.on{display:block}
.scroll{overflow-y:auto;overflow-x:hidden;padding:12px 12px 16px;-webkit-overflow-scrolling:touch}
nav{flex:none;display:flex;gap:4px;padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(#fff3dc,#ffe6bd);border-top:3px solid var(--edge);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 0 3px;border-radius:16px;font-size:11px;font-weight:600;color:var(--ink2);transition:.15s;position:relative}
nav button .ni{font-size:23px;line-height:1.15;transition:transform .2s}
nav button.on{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--shade),inset 0 0 0 2px var(--edge)}
nav button.on .ni{transform:translateY(-2px) scale(1.12)}
nav .dot{position:absolute;top:2px;right:22%;width:10px;height:10px;border-radius:50%;background:var(--pink2);border:2px solid #fff;display:none}
nav .dot.on{display:block;animation:bump 1s infinite}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:16px;font-weight:700;font-size:16px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.18);background:linear-gradient(#7fe08e,var(--good));border-bottom:4px solid var(--good2);transition:transform .08s,filter .15s;position:relative}
.btn:active{transform:translateY(3px);border-bottom-width:1px;margin-bottom:3px}
.btn.pink{background:linear-gradient(#ffa6bb,var(--pink));border-bottom-color:var(--pink2)}
.btn.sun{background:linear-gradient(#ffe083,var(--sun));border-bottom-color:var(--sun2);color:#6b4310;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.sky{background:linear-gradient(#92d5ff,var(--sky));border-bottom-color:var(--sky2)}
.btn.lilac{background:linear-gradient(#cdb9ff,var(--lilac));border-bottom-color:var(--lilac2)}
.btn.ghost{background:#fff;color:var(--ink);text-shadow:none;border:2px solid var(--edge);border-bottom:4px solid var(--shade)}
.btn.small{padding:6px 12px;font-size:14px;border-radius:13px}
.btn.big{padding:14px 20px;font-size:20px;border-radius:20px}
.btn:disabled,.btn.off{filter:grayscale(.85) brightness(1.05);opacity:.65;pointer-events:none}
.card{background:var(--panel);border:3px solid var(--edge);border-radius:22px;box-shadow:0 4px 0 var(--shade);padding:12px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:17px;font-weight:700}
.muted{color:var(--ink2);font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.6px;padding:2px 7px;border-radius:99px;background:var(--lilac);color:#fff;vertical-align:middle;text-transform:uppercase}
.tag.demo{background:var(--sun2)}
.tag.bot{background:var(--lilac2)}
/* village overlays */
#vwrap{position:absolute;inset:0}
#vc{position:absolute;inset:0;width:100%;height:100%;display:block}
#banner{position:absolute;left:8px;right:8px;top:8px;border-radius:18px;padding:6px 12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;background:linear-gradient(90deg,#fff3c4,#ffe0ea);border:3px solid #fff;box-shadow:0 4px 0 rgba(200,140,80,.35),0 8px 18px rgba(120,60,40,.15);z-index:3}
#banner.live{background:linear-gradient(90deg,#ffd166,#ff9fb5,#c7a8ff,#ffd166);background-size:300% 100%;animation:shine 6s linear infinite;color:#4b2a1a}
#banner .bi{font-size:24px;animation:wob 2s ease-in-out infinite}
#banner small{display:block;font-weight:500;opacity:.85;font-size:11px}
@keyframes shine{to{background-position:300% 0}}
@keyframes wob{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.12)}}
#power{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 18px 6px 10px;border-radius:99px;background:linear-gradient(#fffaf0,#ffe9c2);border:3px solid #fff;box-shadow:0 5px 0 var(--shade),0 10px 20px rgba(120,60,40,.2);z-index:3;cursor:pointer;transition:transform .1s}
#power:active{transform:translateX(-50%) scale(.95)}
#power .pi{font-size:30px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
#power b{display:block;font-size:30px;line-height:1;font-weight:700;letter-spacing:.5px;color:#d9506c;text-shadow:0 2px 0 #fff}
#power small{display:block;font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.8px}
#power.pop{animation:bump .5s}
/* sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,1.2,.4,1);padding:0 8px 10px}
#sheet.on{transform:none}
#sheet .in{background:var(--panel);border:3px solid var(--edge);border-radius:26px;box-shadow:0 -6px 30px rgba(120,60,40,.25),0 5px 0 var(--shade);padding:14px;max-height:70dvh;overflow:auto}
#scrim{position:absolute;inset:0;background:rgba(90,50,40,.28);z-index:19;display:none}
#scrim.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sh-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.sh-ico{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:linear-gradient(#fff,#ffeccd);border:3px solid var(--edge);flex:none}
.sh-head h2{margin:0;font-size:21px;line-height:1.1}
.lv{display:inline-block;background:var(--sun);color:#6b4310;border-radius:99px;font-size:12px;font-weight:700;padding:1px 8px;margin-left:6px;vertical-align:middle}
.costs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cost{padding:2px 9px 2px 5px;border-radius:99px;background:#fff;border:2px solid var(--edge);font-weight:600;font-size:14px;display:flex;gap:3px;align-items:center}
.cost.lack{border-color:var(--bad);color:var(--bad2);background:#fff0f1}
.bar{height:14px;border-radius:99px;background:#f3e3c6;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.08)}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(#ffe083,var(--sun));transition:width .25s}
.bar.green>i{background:linear-gradient(#8fe79c,var(--good))}
.bar.pink>i{background:linear-gradient(#ffb0c2,var(--pink))}
.bar.sky>i{background:linear-gradient(#a6dcff,var(--sky))}
.unit{display:flex;align-items:center;gap:8px;padding:8px;border-radius:16px;background:#fff;border:2px solid var(--edge);margin-bottom:6px}
.unit .ui{font-size:28px;width:38px;text-align:center}
.unit .un{font-weight:700;font-size:15px}
.unit.lock{opacity:.55}
.pill{display:inline-flex;gap:3px;align-items:center;font-size:12px;font-weight:600;padding:1px 7px;border-radius:99px;background:#fff;border:2px solid var(--edge)}
/* modal */
#modal{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(90,50,40,.4);padding:18px}
#modal.on{display:flex;animation:fade .2s}
#modal .in{width:100%;max-height:88%;overflow:auto;background:var(--panel);border:3px solid #fff;border-radius:28px;box-shadow:0 12px 40px rgba(60,20,20,.35),0 6px 0 var(--shade);padding:16px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#modal h2{margin:0 0 8px;font-size:22px;text-align:center}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 4px;border-radius:14px;background:#fff;border:2px solid var(--edge);border-bottom-width:4px;font-weight:700;font-size:15px}
.seg button.on{background:var(--sun);border-color:var(--sun2);color:#6b4310}
.sw{width:54px;height:30px;border-radius:99px;background:#e5d6bd;position:relative;transition:.2s;flex:none}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.2);transition:.2s}
.sw.on{background:var(--good)}.sw.on:after{left:27px}
#toasts{position:absolute;left:0;right:0;bottom:84px;z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#fffdf6;border:3px solid var(--edge);border-radius:99px;box-shadow:0 4px 0 var(--shade),0 8px 18px rgba(0,0,0,.15);padding:6px 16px;font-weight:600;font-size:14px;animation:toast 2.6s forwards;max-width:92%;text-align:center}
@keyframes toast{0%{transform:translateY(20px) scale(.8);opacity:0}10%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
/* duel + rank */
.league{display:flex;align-items:center;gap:12px}
.gem{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:32px;border:4px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.12),inset 0 -6px 0 rgba(0,0,0,.1);flex:none}
.big-num{font-size:34px;font-weight:700;line-height:1}
.lb{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:14px;margin-bottom:4px;background:#fff;border:2px solid var(--edge);font-weight:600}
.lb.me{background:linear-gradient(90deg,#fff1b8,#ffd9e3);border-color:var(--sun2);box-shadow:0 3px 0 var(--sun2)}
.lb .rk{width:32px;text-align:center;font-weight:700;color:var(--ink2)}
.lb .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;border:2px solid #fff;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.lb .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ladder{display:flex;justify-content:space-between;gap:4px;margin:10px 0 4px}
.ladder .lg{flex:1;text-align:center;font-size:11px;font-weight:600;opacity:.55}
.ladder .lg.on{opacity:1}
.ladder .lg .gem{width:46px;height:46px;font-size:22px;margin:0 auto 2px}
.ladder .lg.on .gem{box-shadow:0 0 0 3px var(--sun),0 4px 10px rgba(255,180,60,.5)}
.ladder .lg .gem{margin-bottom:6px!important}
/* battle overlay */
#bu{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;background:linear-gradient(#cfeeff,#fdf1dc 40%)}
#bu.on{display:flex}
.bu-top{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(#fff6e6,#ffeccb);border-bottom:3px solid var(--edge)}
.bu-top .tt{flex:1;font-weight:700;font-size:15px;line-height:1.15;min-width:0}
#bc{flex:none;width:100%;display:block;background:#cde}
.bu-bars{flex:none;display:flex;gap:10px;padding:8px 10px 4px}
.bu-bars>div{flex:1;min-width:0}
.bu-bars .nm{font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:4px;white-space:nowrap}
.bu-bars .nm span:first-child{overflow:hidden;text-overflow:ellipsis}
.bu-bars .cnt{font-size:12px;font-weight:600;color:var(--ink2);margin-top:2px;display:flex;gap:6px}
.bu-panel{flex:1;min-height:0;overflow:auto;padding:6px 10px 12px}
.form-row{display:flex;gap:6px}
.form{flex:1;padding:7px 4px;border-radius:16px;background:#fff;border:3px solid var(--edge);text-align:center;font-weight:700;font-size:12.5px;line-height:1.15;transition:.15s}
.form .fi{font-size:26px;display:block}
.form small{display:block;font-weight:500;color:var(--ink2);font-size:10.5px;margin-top:2px}
.form.on{border-color:var(--sun2);background:#fff4cc;transform:translateY(-3px);box-shadow:0 4px 0 var(--sun2)}
.tac{flex:1;padding:8px 4px;border-radius:18px;background:#fff;border:3px solid var(--edge);border-bottom-width:6px;text-align:center;font-weight:700;font-size:14px;transition:transform .08s}
.tac:active{transform:translateY(3px);border-bottom-width:3px}
.tac .fi{font-size:30px;display:block}
.tac small{display:block;font-weight:500;color:var(--ink2);font-size:11px}
.tac.c-charge{background:#ffe7ea;border-color:#ffb3be}.tac.c-hold{background:#e3f4ff;border-color:#a8d9fb}.tac.c-focus{background:#fff3cf;border-color:#ffd77a}
.tac.hint{outline:4px solid var(--good);animation:bump .9s infinite}
.cardrow{display:flex;gap:6px;margin:8px 0}
.cbtn{flex:1;padding:5px 2px;border-radius:14px;background:#fff;border:3px solid var(--edge);text-align:center;font-size:11px;font-weight:600;line-height:1.1;position:relative}
.cbtn .fi{font-size:24px;display:block}
.cbtn .n{position:absolute;top:-6px;right:-3px;background:var(--pink2);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;border:2px solid #fff}
.cbtn.on{border-color:var(--lilac2);background:#efe7ff;transform:translateY(-3px);box-shadow:0 4px 0 var(--lilac2)}
.cbtn.off{opacity:.4;pointer-events:none}
.bigbanner{text-align:center;font-size:34px;font-weight:700;margin:2px 0;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.bigbanner.win{color:#e8a31d;text-shadow:0 3px 0 #fff,0 6px 0 rgba(200,140,40,.3)}
.bigbanner.lose{color:#8a7aa8;text-shadow:0 3px 0 #fff}
.logline{text-align:center;font-weight:600;font-size:14px;min-height:20px;margin:4px 0}
.sl{width:100%;accent-color:var(--pink2)}
.sli{display:flex;align-items:center;gap:6px;margin:2px 0;font-weight:600;font-size:14px}
.sli .ui{font-size:22px;width:28px;text-align:center}
.sli input{flex:1}
.sli .val{width:56px;text-align:right}
/* war */
#wc{position:absolute;left:0;display:block}
.w-hud{position:absolute;left:6px;right:6px;top:5px;display:flex;gap:5px;align-items:center;z-index:2}
.w-hud .chip{font-size:13px;padding:3px 8px 3px 5px}
.ap{display:flex;gap:3px;padding:4px 7px;border-radius:99px;background:#fff;border:2px solid var(--edge);box-shadow:0 2px 0 var(--shade)}
.ap i{width:14px;height:14px;border-radius:50%;background:var(--sun);border:2px solid var(--sun2);transition:.2s}
.ap i.u{background:#eadcc4;border-color:#d8c6a6;transform:scale(.8)}
.w-bottom{position:absolute;left:0;right:0;bottom:0;padding:4px 6px 6px;z-index:2;background:linear-gradient(transparent,var(--bg) 18%)}
.w-info{background:var(--panel);border:3px solid var(--edge);border-radius:18px;padding:6px 10px;box-shadow:0 3px 0 var(--shade);min-height:62px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.w-info .big{font-size:30px;flex:none}
.w-actions{display:flex;gap:5px;margin-top:6px}
.w-actions .btn{flex:1;padding:7px 2px;font-size:12px;flex-direction:column;gap:0;line-height:1.1;border-radius:14px}
.w-actions .btn .bi{font-size:19px}
.w-actions .btn.end{flex:1.35}
.setup .opt{margin:8px 0}
.setup .opt>div:first-child{font-weight:700;margin-bottom:4px}
.passscreen{position:absolute;inset:0;z-index:45;background:linear-gradient(160deg,#ffd9b8,#ffc2d4,#d9c8ff);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center}
.passscreen.on{display:flex}
.passscreen h1{margin:0;font-size:30px}
.evl{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:2px dashed var(--edge);font-size:14px;font-weight:600}
.evl:last-child{border:0}
#busyov{position:absolute;left:10px;right:10px;top:48px;z-index:6;background:#fffdf6ee;border:3px solid var(--edge);border-radius:18px;padding:8px 12px;font-weight:600;font-size:13px;display:none}
#busyov.on{display:block}
.confetti{position:absolute;pointer-events:none;inset:0;z-index:50;overflow:hidden}
/* ===== 6-tab nav ===== */
nav button{font-size:10.5px;min-width:0}nav button .nl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}nav button .ni{font-size:21px}
.pill img.cimg,.cimg{width:1.35em;height:1.35em;vertical-align:-.3em;image-rendering:auto}
.card img.cimg{width:34px;height:34px}
/* ===== explore ===== */
#s-explore{background:#2d5a3a}
.xwrap{position:absolute;inset:0;display:flex;flex-direction:column}
.xmapbox{position:relative;flex:1;min-height:0;overflow:hidden;background:#3d7a45}
.xmap{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
.xmap canvas{display:block;margin:0 auto;image-rendering:pixelated;touch-action:pan-y pan-x}
.xtop{position:absolute;left:6px;top:6px;display:flex;gap:5px;pointer-events:none;z-index:2;flex-wrap:wrap}
.xtop .chip{font-size:12px;padding:2px 9px;background:#fffbe8ee}
.xpanel{flex:none;max-height:46%;overflow:auto;padding:8px 8px 6px;background:linear-gradient(#fff3dc,#ffe6bd);border-top:3px solid var(--edge)}
.xpanel .card{margin-bottom:6px;padding:8px 10px}
.xname{font-size:20px;font-weight:700;line-height:1.1}
.skulls{font-size:13px;letter-spacing:-2px}
.xsp{display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:600;width:48px}.xsp img{width:36px;height:36px}.xsp.unk{opacity:.55}
.xclaim{background:linear-gradient(#fff6c8,#ffe9a0)!important;border-color:var(--sun2)!important;animation:bump 1.2s infinite}
.btn small{font-size:12px;opacity:.85;font-weight:600}
.rbanner{position:absolute;left:0;right:0;top:38px;display:flex;justify-content:center;pointer-events:none;z-index:6}
.rbanner .rb{opacity:0;padding:5px 30px 7px;background:linear-gradient(#fff8e6,#f6dfae);border:3px solid #5a3b2e;border-radius:4px;box-shadow:0 0 0 2px #fff8e6,0 5px 0 #3a2a22;text-align:center;position:relative}
.rbanner .rb:before,.rbanner .rb:after{content:"❖";position:absolute;top:50%;transform:translateY(-50%);color:#c9462c;font-size:14px}.rbanner .rb:before{left:9px}.rbanner .rb:after{right:9px}
.rbanner .rb b{display:block;font-size:21px;letter-spacing:.4px;line-height:1.1}.rbanner .rb small{display:block;font-size:10.5px;color:var(--ink2);font-weight:600}
.rbanner.go .rb{animation:rban 2.8s ease both}
@keyframes rban{0%{transform:translateY(-34px) scale(.92);opacity:0}12%{transform:none;opacity:1}78%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.rbanner-in{margin:-4px auto 8px;width:max-content;max-width:100%;padding:3px 22px;background:linear-gradient(#fff8e6,#f6dfae);border:3px solid #5a3b2e;border-radius:4px;font-weight:700;font-size:15px;box-shadow:0 3px 0 #3a2a22}

<script>
'use strict';
/* ============ CORE / UTIL ============ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const h=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,easeOut=t=>1-Math.pow(1-t,3);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const fmt=n=>Math.floor(n+1e-9).toLocaleString('en-US');
const pick=(a,r=Math.random)=>a[Math.floor(r()*a.length)];
/* ---- storage adapter: local slots now, cloud account later (swap Store.* to sync) ---- */
const SLOT_KEYS=['cozyVillageWars.v1','cozvil.slot2','cozvil.slot3'];
const Store={kind:'local',
  meta(){try{return JSON.parse(localStorage.getItem('cozvil.meta')||'{}')||{}}catch(e){return{}}},
  setMeta(o){try{localStorage.setItem('cozvil.meta',JSON.stringify(Object.assign(Store.meta(),o)))}catch(e){}},
  slotKey(i){return SLOT_KEYS[i]||SLOT_KEYS[0]},
  read(i){try{return JSON.parse(localStorage.getItem(Store.slotKey(i))||'null')}catch(e){return null}},
  write(i,json){try{localStorage.setItem(Store.slotKey(i),json);return true}catch(e){return false}},
  remove(i){try{localStorage.removeItem(Store.slotKey(i))}catch(e){}},
  account:{available:false,status:'coming-soon',signIn(){return Promise.reject(new Error('Account login is coming soon'))}}};
const SLOT=(Store.meta().active|0)%3;
const SAVE_KEY=Store.slotKey(SLOT);
const TYPES=['spear','archer','knight'];
const UN={
  spear:{hp:90,atk:12,pw:10,ico:'🛡️',cost:{food:12,wood:6},time:3,need:1},
  archer:{hp:60,atk:16,pw:12,ico:'🏹',cost:{food:10,wood:14},time:4,need:2},
  knight:{hp:150,atk:18,pw:22,ico:'🐴',cost:{food:24,stone:14},time:6,need:3}};
const BEATS={spear:'knight',knight:'archer',archer:'spear'};
const cm=(u,v)=>BEATS[u]===v?1.6:(BEATS[v]===u?.8:1);
const RES=['food','wood','stone'];
const RICO={food:'🌾',wood:'🪵',stone:'🪨'};
const BD={
  townhall:{ico:'🏰',max:5,base:{wood:60,stone:40},time:6},
  farm:{ico:'🌾',res:'food',max:6,base:{wood:30,stone:12},time:4},
  mill:{ico:'🪵',res:'wood',max:6,base:{stone:24,food:20},time:4},
  mine:{ico:'⛏️',res:'stone',max:6,base:{wood:34,food:24},time:4},
  barracks:{ico:'⚔️',max:6,base:{wood:50,stone:30,food:30},time:5},
  house:{ico:'🏠',max:6,base:{wood:26,food:14},time:3}};
const LAYOUT={townhall:[2,2,2,2],mine:[0,0,2,2],barracks:[4,0,2,2],farm:[0,5,2,2],mill:[4,5,2,2],house1:[1,2,1,1],house2:[4,2,1,1],house3:[4,3,1,1]};
const bType=id=>id.replace(/\d/g,'');
const CARDS={fox:{ico:'🦊'},bear:{ico:'🐻'},owl:{ico:'🦉'},frog:{ico:'🐸'}};
const LEAGUES=[
  {k:'bronze',min:0,col:'#e6a373',ico:'🥉'},{k:'silver',min:200,col:'#cdd7e4',ico:'🥈'},
  {k:'gold',min:500,col:'#ffd166',ico:'🥇'},{k:'platinum',min:900,col:'#7fe3d6',ico:'💠'},
  {k:'diamond',min:1400,col:'#8fd0ff',ico:'💎'}];
const leagueOf=tr=>{let L=LEAGUES[0],i=0;LEAGUES.forEach((l,j)=>{if(tr>=l.min){L=l;i=j}});return{...L,i}};

/* ============ STATE ============ */
const defState=()=>({v:1,lang:null,t:Date.now(),res:{food:220,wood:220,stone:140},
  b:{townhall:{lvl:1},farm:{lvl:1},mill:{lvl:1},mine:{lvl:1},barracks:{lvl:1},house1:{lvl:1},house2:{lvl:1},house3:{lvl:1}},
  troops:{spear:8,archer:5,knight:0},queue:[],trophies:120,cards:{fox:1,bear:1,owl:1,frog:1},
  sound:true,music:true,vol:.6,forceWeekend:false,gems:0,creatures:[],coins:30,fr:{},rep:0,fday:{},bless:{},inv:{},tools:{},eq:{},quests:null,ex:{energy:5,et:Date.now(),exp:null,region:'rise',seen:{}},tut:{step:0,done:false},stats:{wins:0,losses:0,warWins:0,wars:0,weekend:0},war:null,history:[]});
let S=load();
function load(){try{const j=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(j&&j.v===1){const d=defState();return Object.assign(d,j,{res:{...d.res,...j.res},b:{...d.b,...j.b},stats:{...d.stats,...j.stats},cards:{...d.cards,...j.cards},ex:{...d.ex,...j.ex},tut:{...d.tut,...j.tut},bless:{...d.bless,...j.bless},inv:{...d.inv,...j.inv},tools:{...d.tools,...j.tools},eq:{...d.eq,...j.eq}})}}catch(e){}return defState()}
function save(){if(S.fresh)return;try{S.t=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}

/* ============ AUDIO ============ */
let AC=null;
function tone(f,d,type='sine',vol=.07,slide=0,delay=0){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+d+.05)}catch(e){}}
function noise(d,vol=.05,delay=0,lp=1200){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime+delay,n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=lp;g.gain.value=vol;s.connect(f).connect(g).connect(AC.destination);s.start(t0)}catch(e){}}
const SFX={
  tap:()=>tone(660,.09,'triangle',.06,300),pop:()=>{tone(520,.12,'sine',.07,500)},
  coin:()=>{tone(988,.08,'square',.03);tone(1319,.14,'square',.03,0,.07)},
  build:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.07,0,i*.08)),
  err:()=>tone(200,.18,'sawtooth',.04,-60),
  clash:()=>{noise(.18,.08,0,900);tone(120,.15,'sine',.1,-60)},
  hit:()=>{noise(.08,.04,0,2200)},
  win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.08,0,i*.1)),
  lose:()=>[440,392,330,262].forEach((f,i)=>tone(f,.35,'sine',.07,0,i*.14)),
  storm:()=>{noise(.8,.07,0,500);tone(90,.8,'sawtooth',.04,-30)},
  card:()=>{tone(784,.1,'triangle',.06);tone(1175,.2,'sine',.06,0,.08)}};

/* ============ I18N ============ */
const LANGS={en:'English',tr:'Türkçe',de:'Deutsch'};
function detectLang(){const l=((navigator.languages&&navigator.languages[0])||navigator.language||'en').slice(0,2).toLowerCase();return LANGS[l]?l:'en'}
if(!S.lang)S.lang=detectLang();
function t(k,p){let s=(I18N[S.lang]&&I18N[S.lang][k]);if(s==null)s=I18N.en[k];if(s==null)s=k;return p?s.replace(/\{(\w+)\}/g,(m,x)=>p[x]!=null?p[x]:m):s}

/* ============ TOAST / MODAL / SHEET ============ */
function toast(msg){const e=h('div','toast',msg);$('#toasts').appendChild(e);setTimeout(()=>e.remove(),2700);while($('#toasts').children.length>3)$('#toasts').firstChild.remove()}
let modalCb=null;
function modal(html,onClose){const m=$('#modal');$('.in',m).innerHTML=html;m.classList.add('on');modalCb=onClose||null;return $('.in',m)}
function closeModal(){const m=$('#modal');m.classList.remove('on');const cb=modalCb;modalCb=null;cb&&cb()}
$('#modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal'&&!$('#modal .in').dataset.lock)closeModal()});
let sheetKey=null,sheetFn=null;
function openSheet(fn){sheetFn=fn;sheetKey=null;$('#scrim').classList.add('on');$('#sheet').classList.add('on');renderSheet(true)}
function closeSheet(){sheetFn=null;$('#scrim').classList.remove('on');$('#sheet').classList.remove('on')}
function renderSheet(force){if(!sheetFn)return;const r=sheetFn();if(force||r.sig!==sheetKey){sheetKey=r.sig;const sc=$('#sheet .in').scrollTop;$('#sheet .in').innerHTML=r.html;$('#sheet .in').scrollTop=sc;r.bind&&r.bind($('#sheet .in'))}else r.live&&r.live($('#sheet .in'))}
$('#scrim').addEventListener('pointerdown',closeSheet);

/* ============ ECONOMY ============ */
function isWeekend(){const d=new Date().getDay();return S.forceWeekend||d===0||d===6}
const wkMult=()=>isWeekend()?2:1;
const thLvl=()=>S.b.townhall.lvl;
const capOf=()=>400+350*(thLvl()-1)+(window.carryBonus?carryBonus():0);
const rateOf=id=>2*Math.pow(1.3,S.b[id].lvl-1)*(1+(window.creatBonus?creatBonus(id):0))*(S.bless&&S.bless[id]?1.3:1);
const popCap=()=>10+['house1','house2','house3'].reduce((a,i)=>a+S.b[i].lvl*10+(S.bless&&S.bless[i]?10:0),0);
const troopTotal=(a=S.troops)=>a.spear+a.archer+a.knight;
const popUsed=()=>troopTotal()+S.queue.length;
const armyPower=(a=S.troops)=>Math.round(TYPES.reduce((s,k)=>s+a[k]*UN[k].pw,0)*(1+.05*(S.b.barracks.lvl-1)));
function upCost(id){const ty=bType(id),L=S.b[id].lvl,m=Math.pow(1.75,L-1),c={};for(const k in BD[ty].base)c[k]=Math.round(BD[ty].base[k]*m/5)*5;return c}
const upTime=id=>Math.round(BD[bType(id)].time*Math.pow(S.b[id].lvl,1.5));
const maxLvlNow=id=>id==='townhall'?BD.townhall.max:Math.min(BD[bType(id)].max,thLvl()+1);
const building=id=>S.b[id];
const builders=()=>Object.values(S.b).filter(b=>b.up).length;
const canAfford=c=>Object.keys(c).every(k=>S.res[k]>=c[k]);
function upgradeState(id){const b=S.b[id],ty=bType(id);
  if(b.up)return{ok:false,why:'busy'};
  if(b.lvl>=BD[ty].max)return{ok:false,why:'max'};
  if(b.lvl>=maxLvlNow(id))return{ok:false,why:'th',need:thLvl()+1};
  if(builders()>=2)return{ok:false,why:'builders'};
  const gt=typeof upGate==='function'?upGate(id):null;if(gt&&!gt.ok)return{ok:false,why:'gate',g:gt};
  const c=upCost(id);if(!canAfford(c))return{ok:false,why:'res',cost:c};
  return{ok:true,cost:c,g:gt}}
function startUpgrade(id){const u=upgradeState(id);if(!u.ok){SFX.err();return false}
  for(const k in u.cost)S.res[k]-=u.cost[k];if(u.g&&u.g.inv)for(const k in u.g.inv)S.inv[k]=Math.max(0,(S.inv[k]||0)-u.g.inv[k]);const d=upTime(id)*1000;S.b[id].up={end:Date.now()+d,dur:d};SFX.pop();vBounce(id);vSparkBuilding(id,'dust');save();return true}
function tapHelp(id){const b=S.b[id];if(!b.up)return;b.up.end-=1000;SFX.tap();vBounce(id,.5);vSparkBuilding(id,'dust',4);if(b.up.end<=Date.now())tick()}
function enqueueUnit(ty,n){let ok=0;for(let i=0;i<n;i++){const u=UN[ty];if(S.b.barracks.lvl<u.need||popUsed()>=popCap()||!canAfford(u.cost))break;
  for(const k in u.cost)S.res[k]-=u.cost[k];const last=S.queue.length?S.queue[S.queue.length-1].end:Date.now(),start=Math.max(last,Date.now()),d=u.time*1000/(1+.15*(S.b.barracks.lvl-1));
  S.queue.push({ty,end:start+d,dur:d});ok++}
  if(ok){SFX.pop();vBounce('barracks')}else SFX.err();save();return ok}
let lastTick=Date.now(),lastBump={};
function tick(){const now=Date.now();let dt=Math.min((now-lastTick)/1000,3600);lastTick=now;
  const m=wkMult(),cap=capOf();
  for(const id of['farm','mill','mine']){const r=BD[bType(id)].res,add=rateOf(id)*dt*m;const before=S.res[r];S.res[r]=Math.min(cap,S.res[r]+add);if(isWeekend()&&m>1)S.stats.weekend+=Math.max(0,S.res[r]-before)/2}
  for(const id in S.b){const b=S.b[id];if(b.up&&b.up.end<=now){b.up=null;b.lvl++;SFX.build();vBounce(id,1.4);vSparkBuilding(id,'star',26);toast(t('upDone',{n:t('b_'+bType(id)),l:b.lvl}));if(sheetFn)renderSheet(true);updateNavDot()}}
  while(S.queue.length&&S.queue[0].end<=now){const q=S.queue.shift();S.troops[q.ty]++;SFX.hit();vBounce('barracks',.6);pwPop()}
  updateHeader();if(sheetFn)renderSheet();if(tab==='village')updateBanner();}
function updateHeader(){
  for(const r of RES){const e=$('#c-'+r),v=Math.floor(S.res[r]);const sp=$('.v',e);if(sp.textContent!==fmt(v)){const old=lastBump[r]||0;sp.textContent=fmt(v);if(v>old+0&&Date.now()-(lastBump[r+'t']||0)>900){e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump');lastBump[r+'t']=Date.now()}lastBump[r]=v}e.classList.toggle('full',v>=capOf())}
  const p=$('#c-pop .v'),s=popUsed()+'/'+popCap();if(p.textContent!==s)p.textContent=s;
  const pw=armyPower();if(+$('#pw-n').dataset.v!==pw){$('#pw-n').dataset.v=pw;countTo($('#pw-n'),pw)}}
function countTo(el,to,dur=500){const from=+el.dataset.shown||0;el.dataset.shown=to;const t0=performance.now();(function f(n){const k=clamp((n-t0)/dur,0,1);el.textContent=fmt(lerp(from,to,easeOut(k)));if(k<1)requestAnimationFrame(f)})(t0)}
function pwPop(){const p=$('#power');p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop')}
function updateNavDot(){/* ready-to-upgrade hint */}

  volley:{ico:'🏹',atk:{spear:.9,archer:1.35,knight:.9},def:{spear:.95,archer:.9,knight:1.05}},

  TYPES.forEach(u=>{atk[u]=FORM[me.form].atk[u]*((T.atk&&T.atk[u])||1)*TAC[tacMe].atk*tri*(cardMe==='fox'?1.5:1)*me.bonus.atk*(me.surprise&&round===0?1.25:1);
    taken[u]=FORM[me.form].def[u]*TAC[tacMe].t*(cardMe==='bear'?.5:1)*me.bonus.t*(me.role==='def'?(T.defT||1)*(me.fort?.8:1)*(me.cap?.9:1):(T.attT||1))});

function dmgOnto(from,to,mf,mt,tac){const d=zero();let best=null;
  TYPES.forEach(u=>{const raw=from.army[u]*UN[u].atk*KDMG*mf.atk[u];if(raw<=0)return;const ws={};let sum=0;TYPES.forEach(v=>{const w=to.army[v]*UN[v].hp*(tac==='focus'?Math.pow(cm(u,v),3):1);ws[v]=w;sum+=w});if(sum<=0)return;
    TYPES.forEach(v=>{const x=raw*ws[v]/sum*cm(u,v)*mt.taken[v];d[v]+=x;if(cm(u,v)>1&&(!best||x>best.x))best={u,v,x}})});return{d,best}}
function simRound(A,B,terr,tA,tB,cA,cB,round){

/* ============ TOWN: coins, trading post shop, NPC dialogue, friendship hearts ============ */
const SELLP={fiber:3,herb:5,ore:8,shroom:6,reed:3,fish:6,relic:28,stew:20,tea:14,pie:24};
const BUYP={fiber:7,herb:11,ore:17,reed:7};
const BUYRES={food:[40,16],wood:[40,16],stone:[30,16]};
const DISH={stew:'🍲',tea:'🍵',pie:'🥧'};
const ALLI={...ITEMS,...DISH};
const isMarketDay=()=>{const d=new Date().getDay();return d===6||d===0||!!S.forceWeekend};
const frLvl=id=>Math.min(5,Math.floor((S.fr[id]||0)/10));
const heartsStr=id=>{const n=frLvl(id);return'♥'.repeat(n)+'♡'.repeat(5-n)};
const shopDisc=()=>1-.03*frLvl('pip');
const sellMul=()=>(isMarketDay()?1.25:1)+.02*frLvl('pip')+(typeof LF==='function'&&LF().tech.market?.1:0);
function addCoins(n){S.coins=Math.max(0,(S.coins||0)+n)}
function addFr(id,n){const o=frLvl(id);S.fr[id]=Math.min(50,(S.fr[id]||0)+n);if(frLvl(id)>o){toast('💗 '+t('heartUp',{n:t('npc_'+id)}));SFX.win()}}
/* ---- shop ---- */
function openShop(tabSel){let mode=tabSel||'buy';
  const draw=()=>{const m=modal(`<h2>🛖 ${t('tradingPost')}</h2>
   <div class="row" style="justify-content:center;gap:8px;margin-bottom:6px"><span class="pill">🪙 ${fmt(S.coins)}</span>${isMarketDay()?`<span class="pill" style="background:#ffe6a0">🎪 ${t('marketDay')} +25%</span>`:`<span class="pill">🎪 ${t('marketHint')}</span>`}<span class="pill hearts">${heartsStr('pip')}</span></div>
   <div class="xtabs"><button data-m="buy" class="${mode==='buy'?'on':''}">🛒 ${t('buy')}</button><button data-m="sell" class="${mode==='sell'?'on':''}">💰 ${t('sell')}</button></div>
   <div id="shl"></div><button class="btn grow" id="cls" style="width:100%;margin-top:6px">${t('close')}</button>`);
   const list=$('#shl',m);
   if(mode==='buy'){list.innerHTML=Object.keys(BUYRES).map(r=>{const[q,p]=BUYRES[r];const pr=Math.round(p*shopDisc());return`<div class="shoprow"><span style="font-size:22px">${RICO[r]}</span><b class="grow">${t('res_'+r)} ×${q}</b><button class="btn small sun ${S.coins<pr?'off':''}" data-b="r:${r}">🪙 ${pr}</button></div>`}).join('')+
     Object.keys(BUYP).map(i=>{const pr=Math.round(BUYP[i]*shopDisc());return`<div class="shoprow"><span style="font-size:22px">${ITEMS[i]}</span><b class="grow">${t('it_'+i)} <small class="muted">×${S.inv[i]||0}</small></b><button class="btn small sun ${S.coins<pr?'off':''}" data-b="i:${i}">🪙 ${pr}</button></div>`}).join('')+
     `<div class="shoprow"><span style="font-size:22px">💎</span><b class="grow">${t('gemName')}</b><button class="btn small lilac ${S.coins<Math.round(110*shopDisc())?'off':''}" data-b="g:1">🪙 ${Math.round(110*shopDisc())}</button></div>`}
   else{const rows=[];Object.keys(S.inv).forEach(i=>{if(S.inv[i]>0&&SELLP[i])rows.push({k:i,n:S.inv[i],p:Math.round(SELLP[i]*sellMul()),ico:ALLI[i],nm:t('it_'+i)})});
     RES.forEach(r=>{if(S.res[r]>=20)rows.push({k:'res:'+r,n:S.res[r],p:Math.round(6*sellMul()),ico:RICO[r],nm:t('res_'+r)+' ×20'})});
     list.innerHTML=rows.length?rows.map(o=>`<div class="shoprow"><span style="font-size:22px">${o.ico}</span><b class="grow">${o.nm} <small class="muted">×${o.n}</small></b><button class="btn small sun" data-s="${o.k}">🪙 ${o.p}</button></div>`).join(''):`<div class="muted" style="text-align:center;padding:12px">${t('nothingSell')}</div>`}
   $$('[data-m]',m).forEach(b=>b.onclick=()=>{mode=b.dataset.m;SFX.tap();draw()});
   $$('[data-b]',m).forEach(b=>b.onclick=()=>{const[ty,k]=b.dataset.b.split(':');let pr;
     if(ty==='r'){pr=Math.round(BUYRES[k][1]*shopDisc());if(S.coins<pr)return;addCoins(-pr);S.res[k]=Math.min(capOf(),S.res[k]+BUYRES[k][0])}
     else if(ty==='i'){pr=Math.round(BUYP[k]*shopDisc());if(S.coins<pr)return;addCoins(-pr);S.inv[k]=(S.inv[k]||0)+1}
     else{pr=Math.round(110*shopDisc());if(S.coins<pr)return;addCoins(-pr);S.gems++}
     SFX.coin();addFr('pip',.4);save();updateHeader();draw()});
   $$('[data-s]',m).forEach(b=>b.onclick=()=>{const k=b.dataset.s;let p;
     if(k.startsWith('res:')){const r=k.slice(4);if(S.res[r]<20)return;S.res[r]-=20;p=Math.round(6*sellMul())}else{if(!S.inv[k])return;S.inv[k]--;p=Math.round(SELLP[k]*sellMul())}
     addCoins(p);S.stats.sold=(S.stats.sold||0)+1;SFX.coin();addFr('pip',.2);save();updateHeader();draw()});
   $('#cls',m).onclick=closeModal};
  draw()}
/* ---- dialogue ---- */
const NPC={pip:{ico:'🦝',home:'lantern'}};
function runDlg(id,node){const n=NPC[id];const sayKey=node;
  const ch=[];const add=(k,fn,c)=>ch.push({k,fn,c});
  let say=t(sayKey,{h:heartsStr(id)});
  if(node==='pip_start'){say=t(frLvl(id)>=3?'pip_hi3':frLvl(id)>=1?'pip_hi1':'pip_hi0');
    add(t('dTrade'),()=>{closeModal();openShop()},'sun');
    add(t('dRumor'),()=>runDlg(id,'pip_rumor'));
    add(t('dAbout'),()=>runDlg(id,frLvl(id)>=2?'pip_story2':'pip_story1'));
    if(S.inv.pie>0)add('🥧 '+t('dGift'),()=>{S.inv.pie--;addFr(id,10);addCoins(12);save();updateHeader();runDlg(id,'pip_thanks')},'pink');
    add(t('dBye'),()=>closeModal(),'ghost')}
  else if(node==='pip_rumor'){const r=1+Math.floor(Math.random()*5);say=t('pip_r'+r);add(t('dThanks'),()=>runDlg(id,'pip_start'));}
  else if(node==='pip_thanks'){add(t('dOk'),()=>runDlg(id,'pip_start'))}
  else if(node==='pip_story1'||node==='pip_story2'){add(t('dNice'),()=>runDlg(id,'pip_start'))}
  const m=modal(`<div class="dlg"><div class="av">${n.ico}</div><div class="grow"><b>${t('npc_'+id)}</b> <span class="hearts" style="color:#e86a8a">${heartsStr(id)}</span><div class="tx" style="margin-top:4px">${say}</div></div></div><div class="dch">${ch.map((c,i)=>`<button class="btn ${c.c||'sky'} small" data-i="${i}" style="justify-content:flex-start;text-align:left">${c.k}</button>`).join('')}</div>`);
  $$('[data-i]',m).forEach(b=>b.onclick=()=>{SFX.tap();ch[+b.dataset.i].fn()})}
function openTalk(id){const today=new Date().toDateString();if(S.fday[id]!==today){S.fday[id]=today;addFr(id,5);addCoins(frLvl(id)>=2?6:2);toast('🪙 +'+(frLvl(id)>=2?6:2));updateHeader()}save();runDlg(id,id+'_start')}

/* --- pixel lantern-fox sprite (24x24, drawn procedurally with auto outline) --- */
function foxSprite(cv,blink){const W=24,g=cv.getContext('2d');cv.width=W;cv.height=W;g.clearRect(0,0,W,W);
  const px=[];for(let y=0;y<W;y++){px.push(new Array(W).fill(null))}
  const set=(x,y,c)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<W&&y<W)px[y][x]=c};
  const fillE=(cx,cy,rx,ry,c)=>{for(let y=0;y<W;y++)for(let x=0;x<W;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)set(x,y,c)}};
  const tri=(a,b,c,col)=>{for(let y=0;y<W;y++)for(let x=0;x<W;x++){const p=[x+.5,y+.5];const s=(p1,p2,p3)=>(p1[0]-p3[0])*(p2[1]-p3[1])-(p2[0]-p3[0])*(p1[1]-p3[1]);const d1=s(p,a,b),d2=s(p,b,c),d3=s(p,c,a);if(!((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0)))set(x,y,col)}};
  const O='#5a3326',R='#f2913f',D='#d96a2b',C='#fff1d6',P='#ff9fb5',E='#2a1a1a',H='#ffffff',N='#3a2323',Y='#ffe07a',B='#fff7c4',K='#8a6b5c';
  fillE(4.2,16.5,3.6,5.2,R);fillE(3.4,12.6,2.5,2.4,C);fillE(5,18.5,2,3,D);          // tail
  fillE(12,18.5,5.6,5,R);fillE(12,19.4,3.1,3.6,C);                                   // body + belly
  tri([4.2,7],[5.6,0.6],[10.2,4.4],R);tri([19.8,7],[18.4,0.6],[13.8,4.4],R);         // ears
  tri([5.7,5.6],[6.3,2.9],[8.6,4.4],P);tri([18.3,5.6],[17.7,2.9],[15.4,4.4],P);
  fillE(12,10.2,8,6.2,R);                                                            // head
  fillE(7.4,12.8,4,2.4,C);fillE(16.6,12.8,4,2.4,C);fillE(12,13.6,3.2,2.2,C);         // cheeks / muzzle
  fillE(12,5.6,2.2,1.2,D);                                                           // forehead tuft
  set(9,22.4,D);set(10,22.4,D);set(14,22.4,D);set(13,22.4,D);
  // outline
  const o=px.map(r=>r.slice());for(let y=0;y<W;y++)for(let x=0;x<W;x++){if(px[y][x])continue;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const yy=y+dy,xx=x+dx;if(yy>=0&&xx>=0&&yy<W&&xx<W&&px[yy][xx]){o[y][x]=O;break}}}
  const draw=(x,y,c)=>{if(x>=0&&y>=0&&x<W&&y<W)o[y][x]=c};
  // face
  if(blink){for(const ex of[8,14]){draw(ex,10,E);draw(ex+1,10,E)}}else{for(const ex of[8,14]){for(let y=9;y<=11;y++){draw(ex,y,E);draw(ex+1,y,E)}draw(ex,9,H)}}
  draw(11,12,N);draw(12,12,N);draw(5,12,P);draw(6,12,P);draw(17,12,P);draw(18,12,P);
  draw(11,13,O);draw(12,13,O);
  // lantern on a little stick (right side)
  for(let y=9;y<=21;y++)draw(21,y,K);draw(20,9,K);draw(19,9,K);
  for(let y=12;y<=16;y++)for(let x=19;x<=23;x++)draw(x,y,(x===19||x===23||y===12||y===16)?O:Y);
  draw(21,13,B);draw(21,14,B);draw(21,15,B);draw(20,14,B);draw(22,14,B);draw(21,11,O);draw(20,11,O);draw(22,11,O);draw(21,17,O);
  for(let y=0;y<W;y++)for(let x=0;x<W;x++){if(o[y][x]){g.fillStyle=o[y][x];g.fillRect(x,y,1,1)}}}

const TUT={on:false,idx:0,base:{},hold:0,sig:'',timer:null,blinkT:null,seenBattle:false,sheetId:null,exSeen:false};
const tutActive=()=>!!(TUT.on&&!S.tut.done);
const tutStep=()=>TUT.on?TUT.idx:-1;
const tutDuelEasy=()=>tutActive()&&TUT_STEPS[TUT.idx]&&TUT_STEPS[TUT.idx].id==='duel';
const tutExp=()=>tutActive()&&TUT_STEPS[TUT.idx]&&TUT_STEPS[TUT.idx].id==='explore';
const navSel=n=>`nav button[data-tab="${n}"]`;
const sheetOn=()=>$('#sheet').classList.contains('on');
const modalOn=()=>$('#modal').classList.contains('on');
const battleOn=()=>$('#bu').classList.contains('on');
const goTab=n=>tab!==n?navSel(n):null;
const totalTroops=()=>TYPES.reduce((a,k)=>a+(S.troops[k]||0),0)+S.queue.length;
const bumpRes=c=>{for(const k in c)if(S.res[k]<c[k])S.res[k]=c[k];updateHeader()};

     return{text:t('tut1c'),hl:{b:'townhall'}}}
   if(tab!=='village')return{text:t('tut1',{b:nm()}),hl:navSel('village')};
   if(sheetOn()&&TUT.sheetId==='townhall')return{text:t('tut1b',{u:t('upgrade')}),hl:'[data-a="up"]'};
   if(sheetOn())return{text:t('tut1',{b:nm()}),hl:'[data-a="x"]'};
   return{text:t('tut1',{b:nm()}),hl:{b:'townhall'}}},
  done:()=>S.b.townhall.lvl>TUT.base.th||(!S.b.townhall.up&&!upgradeState('townhall').ok&&upgradeState('townhall').why!=='res'&&TUT.next1x)},
 {id:'res',btn:'tutNext',view:()=>{if(sheetOn())closeSheet();return{text:t('tut2'),hl:'#top'}}},
 {id:'troops',enter(){TUT.base.tt=totalTroops();bumpRes(UN.spear.cost)},
  view(){if(S.queue[0]&&S.queue[0].end-Date.now()>3500){S.queue[0].end=Date.now()+3000;S.queue[0].dur=3000}
   if(tab!=='village')return{text:t('tut3'),hl:navSel('village')};
   if(sheetOn()&&TUT.sheetId==='barracks'){if(S.res.food<UN.spear.cost.food)bumpRes(UN.spear.cost);return{text:t('tut3b'),hl:'[data-a="tr"][data-u="spear"][data-n="1"]'}}
   if(sheetOn())return{text:t('tut3'),hl:'[data-a="x"]'};
   return{text:t('tut3'),hl:{b:'barracks'}}},
  done:()=>totalTroops()>TUT.base.tt},
 {id:'explore',enter(){S.ex.energy=Math.max(S.ex.energy,2);TUT.exSeen=!!S.ex.exp},
  view(){if(sheetOn())closeSheet();const ex=S.ex.exp;
   if(modalOn()&&$('#modal [data-treat]'))return{text:t('tut4e'),hl:$('#modal [data-fav]')?'#modal [data-fav]':'#modal [data-treat]'};
   if(modalOn())return{text:t('tut4d'),hl:'#modal .btn:not(.ghost)'};
   if(tab!=='explore')return{text:ex&&expDone()?t('tut4d'):t('tut4'),hl:navSel('explore')};

   if(expDone())return{text:t('tut4d'),hl:'#xclaim'};

 {id:'assign',enter(){if(!S.creatures.length)giveCreature('dandy')},

   if(tab!=='duel')return{text:t('tut6'),hl:navSel('duel')};

 {id:'war3',btn:'tutNext',view:()=>({text:t('tut7c'),pos:'top'})},
 {id:'war4',btn:'tutNext',view:()=>({text:t('tut7d'),pos:'top'})},
 {id:'end',btn:'tutGo',view:()=>({text:t('tut7e'),pos:'top'}),finish:true}
];})();
function tutDOM(){let b=$('#tut .tutb');if(b)return b;b=document.createElement('div');b.className='tutb bot';
  b.innerHTML='<canvas width="24" height="24"></canvas><div class="bub"><b class="nm"></b><div class="tx"></div><div class="acts"><span class="dots"></span><button class="skip" type="button"></button><button class="btn small" type="button" id="tutbtn"></button></div></div>';
  $('#tut').appendChild(b);foxSprite($('canvas',b),false);
  $('.skip',b).onclick=()=>{SFX.tap();tutFinish(true)};
  $('#tutbtn',b).onclick=()=>{SFX.tap();tutAdvance()};return b}
function tutPlace(h){const hl=$('#tuthl');if(!h){hl.style.display='none';return null}
  const app=$('#tut').getBoundingClientRect();let r;
  if(typeof h==='object'){if(tab!=='village'){hl.style.display='none';return null}const cr=V.cv.getBoundingClientRect(),b=bRect(h.b);r={left:cr.left+b.x,top:cr.top+b.y-b.h*.05,width:b.w,height:b.h*1.05}}
  else{const el=document.querySelector(h);if(!el){hl.style.display='none';return null}const rc=el.getBoundingClientRect();if(rc.width<2||rc.height<2){hl.style.display='none';return null}r=rc}
  const pad=6;hl.style.display='block';hl.style.left=(r.left-app.left-pad)+'px';hl.style.top=(r.top-app.top-pad)+'px';hl.style.width=(r.width+pad*2)+'px';hl.style.height=(r.height+pad*2)+'px';
  hl.style.borderRadius=(typeof h==='object'?'22px':'16px');return r}
function tutRender(v,s,r){const b=tutDOM();const ah=$('#tut').getBoundingClientRect().height;const pos=v.pos||(r?((r.top+r.height/2)>ah*.5?'top':'bot'):((sheetOn()||modalOn()||battleOn())?'top':'bot'));
  const sig=[s.id,v.text,pos,v.btn||s.btn||'',S.lang].join('|');
  if(sig!==TUT.sig){TUT.sig=sig;b.className='tutb '+pos;b.style.animation='none';void b.offsetWidth;b.style.animation='';
   $('.nm',b).textContent=t('tutName');$('.tx',b).innerHTML=v.text;
   const dots=TUT_STEPS.map((_,i)=>i<TUT.idx?'●':(i===TUT.idx?'◉':'○')).join('');$('.dots',b).textContent=dots;
   $('.skip',b).textContent=t('tutSkip');const btn=$('#tutbtn',b),bt=v.btn||s.btn;btn.style.display=bt?'':'none';if(bt)btn.textContent=t(bt)}}
function tutAdvance(){const s=TUT_STEPS[TUT.idx];if(!s)return;if(s.finish){tutFinish(false);return}
  TUT.idx++;S.tut.step=TUT.idx;save();TUT.hold=0;TUT.sig='';const n=TUT_STEPS[TUT.idx];n.enter&&n.enter();tutPoll(true)}
function tutPoll(now){if(!TUT.on)return;const s=TUT_STEPS[TUT.idx];if(!s)return;
  let v;try{v=s.view()}catch(e){v={text:''}}
  if(v.btn===undefined&&s.btn===undefined){} 
  if(s.id==='th'&&v.btn==='tutNext')TUT.next1x=true;
  const r=tutPlace(v.hl);tutRender(v,s,r);
  if(r&&v.hl&&typeof v.hl==='string'){const el=document.querySelector(v.hl);if(el&&TUT.lastHl!==v.hl){TUT.lastHl=v.hl;try{el.scrollIntoView({block:'nearest',inline:'nearest'})}catch(e){}}}else if(!v.hl)TUT.lastHl=null;
  if(!s.btn&&!v.btn&&s.done){if(!TUT.hold&&s.done())TUT.hold=Date.now();if(TUT.hold&&Date.now()-TUT.hold>700)tutAdvance()}}
function tutStart(replay){if(TUT.on)return;
  if(replay){S.tut={step:0,done:false};closeModal();closeSheet();if(tab!=='village')setTab('village')}
  TUT.on=true;TUT.idx=Math.min(S.tut.step||0,TUT_STEPS.length-1);TUT.sig='';TUT.hold=0;TUT.next1x=false;
  $('#tut').classList.add('on');const s=TUT_STEPS[TUT.idx];s.enter&&s.enter();
  tutDOM();tutPoll(true);clearInterval(TUT.timer);TUT.timer=setInterval(tutPoll,300);

function roKey(e,down){if(!RO.on)return;if(roModalOpen()&&down)return;const k=RO_KEYS[e.key];
  if(k){RO.keys[k]=down;e.preventDefault();return}
  if(down&&(e.key===' '||e.key==='e'||e.key==='E'||e.key==='Enter')){e.preventDefault();roAct()}
  if(down&&(e.key==='m'||e.key==='M'))roMap();if(down&&e.key==='Escape')roExit()}

  const A=$('#roA');A.addEventListener('pointerdown',e=>{e.preventDefault();roAct()});

  const mv=e=>{const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=(e.clientX-cx)/(r.width/2),dy=(e.clientY-cy)/(r.height/2);const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}
    RO.jx=Math.abs(dx)<.15?0:dx;RO.jy=Math.abs(dy)<.15?0:dy;knob.style.transform=`translate(${dx*30}px,${dy*30}px)`};
  joy.addEventListener('pointerdown',e=>{pid=e.pointerId;joy.setPointerCapture(pid);mv(e);e.preventDefault()});

  const up=e=>{if(e.pointerId===pid){pid=null;RO.jx=RO.jy=0;knob.style.transform=''}};joy.addEventListener('pointerup',up);joy.addEventListener('pointercancel',up);

function roExit(){if(!RO.on)return;RO.on=false;cancelAnimationFrame(RO.raf);S.ro.x=Math.round(RO.x);S.ro.y=Math.round(RO.y);$('#ro').classList.remove('on');XM.sel=S.ex.region;save();musicSync();updateHeader();if(typeof renderExplore==='function')renderExplore(true)}
function roEject(){if(roFree(RO.x,RO.y))return;for(let r=1;r<14;r++)for(let a=0;a<16;a++){const x=RO.x+Math.cos(a/16*6.28)*r,y=RO.y+Math.sin(a/16*6.28)*r;if(roFree(x,y)){RO.x=x;RO.y=y;return}}}

function roZone(first){let best=null,bd=9;REG.forEach(r=>{const d=Math.hypot(RO.x-r.x,(RO.y-r.y)*1.12)/(r.R||15);if(d<bd){bd=d;best=r}});
  if(best&&best.id!==RO.reg){RO.reg=best.id;XM.sel=best.id;S.ex.region=best.id;if(!first){roBanner('🏞️ '+t('rn_'+best.id),t('bio_'+best.bio))}musicSync()}

function roFrame(ts){if(!RO.on)return;RO.raf=requestAnimationFrame(roFrame);const dt=Math.min(.05,RO.last?(ts-RO.last)/1000:.016);RO.last=ts;RO.tt+=dt;
  const paused=RO.busy||roModalOpen();
  if(!paused){roMove(dt);roAI(dt);roNear()}else{RO.mv=false}
  RO.swing=Math.max(0,RO.swing-dt);RO.zt=(RO.zt||0)+dt;if(RO.zt>.25){RO.zt=0;roZone()}
  RO.parts=RO.parts.filter(p=>(p.l-=dt)>0);RO.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=40*dt});
  roDraw();roHud();RO.saveT+=dt;if(RO.saveT>6){RO.saveT=0;S.ro.x=Math.round(RO.x);S.ro.y=Math.round(RO.y);save()}}
function roMove(dt){let dx=(RO.keys.r?1:0)-(RO.keys.l?1:0),dy=(RO.keys.d?1:0)-(RO.keys.u?1:0);if(!dx&&!dy){dx=RO.jx;dy=RO.jy}
  const m=Math.hypot(dx,dy);RO.mv=m>.05;if(!RO.mv)return;if(m>1){dx/=m;dy/=m}
  const sp=(S.tools&&S.tools.boots?36:30)*dt;let nx=RO.x+dx*sp,ny=RO.y+dy*sp;let moved=false;
  const lk=r=>{if(RO.bump<=0){toast('🔒 '+t('needTH',{n:r.th}));RO.bump=2.2}};RO.bump-=dt;
  if(Math.abs(dx)>.01){const L1=roLockedAt(nx,RO.y);if(L1)lk(L1);else if(roFree(nx,RO.y)){RO.x=nx;moved=true}}
  if(Math.abs(dy)>.01){const L2=roLockedAt(RO.x,ny);if(L2)lk(L2);else if(roFree(RO.x,ny)){RO.y=ny;moved=true}}

function roAI(dt){const heroD=(o)=>Math.hypot(o.x-RO.x,o.y-RO.y);
  RO.cre.forEach(c=>{const d=heroD(c);c.w-=dt;if(c.w<=0){c.w=1.5+Math.random()*3;if(d<16){const a=Math.atan2(c.y-RO.y,c.x-RO.x)+(Math.random()-.5);c.tx=c.x+Math.cos(a)*10;c.ty=c.y+Math.sin(a)*10}else{c.tx=c.x+(Math.random()-.5)*14;c.ty=c.y+(Math.random()-.5)*10}}
    const dx=c.tx-c.x,dy=c.ty-c.y,m=Math.hypot(dx,dy);if(m>.6){const sp=(d<14?16:7)*dt,nx=c.x+dx/m*sp,ny=c.y+dy/m*sp;if(roFree(nx,ny)&&!roLockedAt(nx,ny)){c.x=nx;c.y=ny}else c.tx=c.x;c.dir=dx<0?-1:1}});

    const dx=tx-o.x,dy=ty-o.y,m=Math.hypot(dx,dy);if(m>.8){const nx=o.x+dx/m*sp*dt,ny=o.y+dy/m*sp*dt;if(roFree(nx,ny)&&!roLockedAt(nx,ny)){o.x=nx;o.y=ny}o.dir=dx<0?-1:1}});
  RO.cdMon=Math.max(0,(RO.cdMon||0)-dt)||0}

const RO_RANGE={tree:7,rock:7,berry:7,crystal:7,chest:7,fish:9,cave:9,rune:9,home:10,cre:11,npc:10,mon:8};

const AVA=['🧑‍🌾','👩‍🌾','🧑‍🍳','👨‍🔧','🧑‍🎨','👩‍🔬'];
const cottageCost=()=>{const h=LF().homes-1;return{wood:50+45*h,stone:20+30*h}},storeCost=()=>{const n=LF().store+1;return{wood:110*n,stone:80*n}};

function openHall(tabSel){if(tabSel)hallTab=tabSel;const l=LF();
  const tabs=[['town','🏠'],['folk','👥'],['quests','📜'],['tech','🔬'],['awards','🏆']];
  const dots={quests:qReadyCount()>0,folk:l.vil.some(v=>v.wish&&v.mood<50),town:l.pot>=30};

  const box=$('#hl',m);const rl=repLvl(),nx=REPT[rl+1];
  if(hallTab==='town'){const st=seasonIdx(),taxL=['0','1','2','3'];
    box.innerHTML=`<div class="row" style="justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:6px"><span class="pill">🪙 ${fmt(S.coins)}</span><span class="pill">${SEA_ICO[st]} ${t('s_'+SEAS[st])} · ${t('dayN',{n:dayOfSeason()+1})}</span><span class="pill">🏅 ${t('rep'+rl)}${nx?' '+(S.rep||0)+'/'+nx:''}</span><span class="pill">${moodIco(avgMood())} ${Math.round(avgMood())}%</span></div>
     <div class="hrow ${festActive()?'fe':''}"><span class="hi">🎉</span><div class="grow"><b>${festActive()?t('festNow'):t('festHost')}</b><small class="muted">${festActive()?t('festLeft'):t('festInfo')}</small></div>${festActive()?'':`<button class="btn small sun ${(S.coins<40||S.res.food<60)?'off':''}" id="fe">🪙40 🌾60</button>`}</div>
     <div class="hrow"><span class="hi">💰</span><div class="grow"><b>${t('taxes')}</b><div class="row" style="gap:4px;margin-top:3px">${taxL.map((x,i)=>`<button class="btn tiny ${l.tax===i?'sun':'ghost'}" data-tx="${i}">${t('tax'+i)}</button>`).join('')}</div></div><button class="btn small sun ${l.pot<1?'off':''}" id="tc">🪙 ${Math.floor(l.pot)}</button></div>
     <div class="hrow"><span class="hi">🏠</span><div class="grow"><b>${t('homes')} ${l.homes}</b> <small class="muted">${t('folkN',{n:l.vil.length,c:popCapL()})}</small><div>${resPills(cottageCost())}</div></div><button class="btn small sun ${(!payRes(cottageCost())||l.homes>=12)?'off':''}" id="hb">${t('build')}</button></div>
     <div class="hrow"><span class="hi">📦</span><div class="grow"><b>${t('store')} ${l.store}/5</b> <small class="muted">${t('lCap')} ${fmt(capOf())}</small><div>${l.store<5?resPills(storeCost()):''}</div></div><button class="btn small sun ${(l.store>=5||!payRes(storeCost()))?'off':''}" id="sb">${t('upgrade')}</button></div>
     <div class="hrow"><span class="hi">🎪</span><div class="grow"><b>${t('marketDay')}</b> <small class="muted">${isMarketDay()?t('marketOn'):t('marketHint')}</small></div></div>`;
    $$('[data-tx]',box).forEach(b=>b.onclick=()=>{l.tax=+b.dataset.tx;SFX.tap();save();openHall()});
    const tc=$('#tc',box);tc.onclick=()=>{const n=Math.floor(l.pot);if(n<1)return;l.pot-=n;addCoins(n);SFX.coin();toast('🪙 +'+n);updateHeader();save();openHall()};
    const hb=$('#hb',box);hb.onclick=()=>{if(l.homes>=12||!payRes(cottageCost()))return SFX.err();takeRes(cottageCost());l.homes++;SFX.build();toast('🏠 '+t('homeBuilt'));updateHeader();save();openHall()};
    const sb=$('#sb',box);sb.onclick=()=>{if(l.store>=5||!payRes(storeCost()))return SFX.err();takeRes(storeCost());l.store++;SFX.build();toast('📦 '+t('storeUp'));updateHeader();save();openHall()};
    const fe=$('#fe',box);if(fe)fe.onclick=()=>{if(S.coins<40||S.res.food<60)return SFX.err();addCoins(-40);S.res.food-=60;l.festEnd=Date.now()+DAYMS*.5;l.cnt.fest=(l.cnt.fest||0)+1;l.vil.forEach(v=>v.mood=Math.min(100,v.mood+20));addRep(4);SFX.win();toast('🎉 '+t('fest_'+SEAS[st]));achCheck();updateHeader();save();openHall()}}
  else if(hallTab==='folk'){box.innerHTML=`<div class="muted" style="text-align:center;margin-bottom:4px;font-size:12px">${t('folkN',{n:l.vil.length,c:popCapL()})} · ${t('folkHint')}</div>`+l.vil.map((v,i)=>{const w=v.wish,can=w&&(w.res?Object.keys(w.res).every(k=>S.res[k]>=w.res[k]):Object.keys(w.item).every(k=>(S.inv[k]||0)>=w.item[k]));
    return`<div class="shoprow vrow"><span style="font-size:24px">${AVA[v.hat%AVA.length]}</span><div class="grow"><b>${v.n}</b> <button class="btn tiny ghost" data-j="${i}">${JOBS[v.job].ico} ${t('job_'+v.job)} ⟳</button><div class="mbar"><i style="width:${Math.round(v.mood)}%;background:${v.mood>=60?'#7ed87a':v.mood>=40?'#ffc94d':'#ff7a6a'}"></i></div></div><span style="font-size:20px">${moodIco(v.mood)}</span>${w?`<button class="btn small ${can?'pink':'ghost off'}" data-w="${i}">${wishIco(w)}</button>`:`<small class="muted">💤</small>`}</div>`}).join('');

L("d_tilda_r1","Warm words cost nothing and light up a whole village. 💗","Sıcak sözler bedava ama koca bir köyü aydınlatır. 💗","Warme Worte kosten nichts und erhellen ein ganzes Dorf. 💗");L("d_tilda_r2","Low taxes make folk happy, but empty pockets don't build cottages. Balance, dear!","Düşük vergi halkı mutlu eder ama boş kese kulübe yapmaz. Denge, canım!","Niedrige Steuern machen froh, aber leere Taschen bauen keine Häuser. Balance, Liebes!");L("d_tilda_r3","Ha! Cake grants wishes and lifts moods. Wise answer, take a coin.","Ha! Pasta dilekleri yerine getirir, keyfi yükseltir. Akıllıca, bir altın al.","Ha! Kuchen erfüllt Wünsche und hebt die Laune. Kluge Antwort, nimm eine Münze.");
L("d_marlo_hi","Shh… you'll scare the fish. Oh, it's you! Welcome to the dock.","Şş… balıkları ürkütürsün. Ah, sensin! İskeleye hoş geldin.","Pst… du verscheuchst die Fische. Ach, du bist's! Willkommen am Steg.");L("d_marlo_q","Any fishing tips?","Balık tutma ipucu var mı?","Hast du Angeltipps?");L("d_marlo_a1","You seem very patient.","Çok sabırlısın.","Du wirkst sehr geduldig.");L("d_marlo_a2","Where do they bite best?","En çok nerede yem yer?","Wo beißen sie am besten?");L("d_marlo_a3","I once caught a boot.","Bir keresinde çizme yakaladım.","Ich habe mal einen Stiefel gefangen.");
L("d_marlo_r1","Patience is half the line. Thanks for noticing, friend. 💗","Sabır oltanın yarısıdır. Fark ettiğin için sağ ol dostum. 💗","Geduld ist die halbe Angel. Danke fürs Bemerken, Freund. 💗");L("d_marlo_r2","Here at the dock! A rod doubles your catch. Take some reed for a start.","Burada, iskelede! Olta avı ikiye katlar. Başlangıç için biraz sazlık al.","Genau hier am Steg! Mit Rute fängst du doppelt. Nimm etwas Schilf.");L("d_marlo_r3","Ha! Mine was a left slipper. Here, a few coins for the laugh.","Ha! Benimki sol terlikti. Kahkaha için biraz altın al.","Ha! Meiner war ein linker Pantoffel. Hier, ein paar Münzen fürs Lachen.");

const CH_SKIN=['#ffe0c7','#f6c9a3','#e0a878','#c68642','#8d5524','#5c3a21'];
const CH_HAIR=['#3b2a20','#6b4a2f','#b5651d','#e8c36a','#d84a4a','#f48fb1','#6cc3ff','#cfd2e0'];
const CH_CLOTH=['#e8794a','#ff8fa8','#ffcf5c','#6bd17f','#5ccfc0','#6cc3ff','#b79cff','#f5efe6'];
const CH_N={hs:6,os:5,hat:6};
function defLook(){return{skin:1,hs:0,hc:1,os:0,oc:5,ac:0,hat:0,hatc:0}}
function randLook(){const r=Math.random.bind(Math),i=n=>Math.floor(r()*n);return{skin:i(6),hs:i(6),hc:i(8),os:i(5),oc:i(8),ac:i(8),hat:i(6),hatc:i(8)}}
function heroLook(){if(!S.hero)S.hero={name:'',look:defLook()};return S.hero.look}
const shade=(hex,k)=>{const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.max(0,Math.min(255,Math.round(r*k)));g=Math.max(0,Math.min(255,Math.round(g*k)));b=Math.max(0,Math.min(255,Math.round(b*k)));return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)};
const _csp={};
/* dir: 0 front, 1 back, 2 right (flip for left). frame 0..3 (0,2 stand; 1,3 steps). returns 16x24 canvas */
function charSprite(look,dir,frame,extra){const key=[look.skin,look.hs,look.hc,look.os,look.oc,look.ac,look.hat,look.hatc,dir,frame,extra||''].join(',');if(_csp[key])return _csp[key];
  const cv=document.createElement('canvas');cv.width=16;cv.height=24;const g=cv.getContext('2d');
  const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
  const sk=CH_SKIN[look.skin%6],skd=shade(sk,.86),hc=CH_HAIR[look.hc%8],hcd=shade(hc,.78),oc=CH_CLOTH[look.oc%8],ocd=shade(oc,.82),ac=CH_CLOTH[look.ac%8],acd=shade(ac,.82),ht=CH_CLOTH[look.hatc%8],htd=shade(ht,.8),ink='#3a2a2e';
  const step=frame===1?1:frame===3?-1:0,bob=(frame===1||frame===3)?1:0,os=look.os,hs=look.hs,hat=look.hat;
  const side=dir===2,back=dir===1;
  const by=bob?0:0;
  // legs / shoes
  const legC=os===2?oc:os===4?sk:'#7a6a8a',legD=os===2?ocd:os===4?skd:'#5f5070';
  if(side){const a=step>0?-1:step<0?1:0;R(6+a,17,3,5,legC);R(8-a,17,3,5,legD);R(6+a,22,4,2,ink);R(8-a,22,4,2,'#2e2024')}
  else{const a=step>0?1:0,b=step<0?1:0;R(5,17-a,3,5+a,legC);R(9,17-b,3,5+b,legD);R(5,22-a,3,2,ink);R(9,22-b,3,2,'#2e2024');R(5,17-a,3,0,legC)}
  // body
  const bodyY=10;
  const torso=(c,cd)=>{if(side){R(5,bodyY,7,8,c);R(5,bodyY+7,7,1,cd)}else{R(4,bodyY,8,8,c);R(4,bodyY+7,8,1,cd)}};
  if(os===4){ // dress
    torso(oc,ocd);R(side?4:3,bodyY+6,side?9:10,5,oc);R(side?4:3,bodyY+10,side?9:10,1,ocd);R(side?4:3,bodyY+8,side?9:10,1,acd)}
  else if(os===3){ // coat
    torso(oc,ocd);R(side?4:3,bodyY+4,side?9:10,7,oc);R(side?4:3,bodyY+10,side?9:10,1,ocd);if(!back&&!side){R(7,bodyY,2,10,acd);R(4,bodyY+5,8,1,ink);R(7,bodyY+5,2,2,'#ffe27a')}if(side)R(5,bodyY+5,8,1,ink)}
  else if(os===2){ // overalls
    torso(ac,acd);if(!back){R(4,bodyY+3,8,6,oc);R(5,bodyY+1,2,3,oc);R(9,bodyY+1,2,3,oc);R(6,bodyY+5,4,2,ocd)}else{R(4,bodyY+3,8,6,oc);R(5,bodyY,1,4,oc);R(10,bodyY,1,4,oc)}}
  else if(os===1){ // hoodie
    torso(oc,ocd);if(!back){R(5,bodyY,6,2,ocd);if(!side){R(7,bodyY+2,2,4,acd);R(5,bodyY+6,6,2,ocd)}}else R(5,bodyY-1,6,3,ocd)}
  else{torso(oc,ocd);if(!back&&!side){R(6,bodyY,4,1,sk);R(6,bodyY+1,4,0,skd);R(4,bodyY+4,8,1,ac)}else if(side)R(5,bodyY+4,7,1,ac)}
  // arms
  const long=(os===1||os===3),armC=long?oc:sk,armD=long?ocd:skd,sw=step*1;
  if(side){R(6,bodyY+1+sw,3,6,armC);R(6,bodyY+7+sw,3,1,sk)}
  else{R(2,bodyY+1-(step>0?1:0),2,6,armC);R(12,bodyY+1-(step<0?1:0),2,6,armD);R(2,bodyY+7-(step>0?1:0),2,1,sk);R(12,bodyY+7-(step<0?1:0),2,1,skd)}
  // head
  const hy=2,hx=side?4:4,hw=side?8:8;
  if(extra==='fish'&&side){R(13,6,1,10,'#8a5a3a');R(14,6,1,1,'#fff')}
  // back hair under head for long styles
  if((hs===1||hs===5||hs===4)&&(back||side)){const c=hc;if(hs===1){R(back?3:3,hy+3,back?10:6,9,c);R(3,hy+11,back?10:6,1,hcd)}if(hs===5){R(side?3:11,hy+3,2,7,c);if(back)R(7,hy+5,2,8,c)}}
  R(hx,hy+1,hw,8,sk);R(hx,hy+8,hw,1,skd);
  if(!back&&!side){R(3,hy+4,1,2,sk);R(12,hy+4,1,2,sk)}
  // face
  if(dir===0){R(6,hy+4,1,2,ink);R(9,hy+4,1,2,ink);R(5,hy+6,2,1,'rgba(255,120,140,.45)');R(9,hy+6,2,1,'rgba(255,120,140,.45)');R(7,hy+7,2,1,'#b0525f')}
  else if(dir===2){R(10,hy+4,1,2,ink);R(11,hy+6,1,1,skd);R(9,hy+6,2,1,'rgba(255,120,140,.45)');R(10,hy+7,2,1,'#b0525f')}
  // hair front

function farmWarm(x,y){const B=NW.objs;for(const bid in NWP().beacon){if(!NWP().beacon[bid])continue;const o=beaconObjs()[bid];if(o&&Math.hypot(o.x-x,o.y-y)<16)return true}return false}

function farmIdx(x,y){return y*NWN+x}

function farmSync(p,x,y){const today=farmDay();if(p.d==null)p.d=today;if(!p.c){p.d=today;return}const def=CROPS[p.c];let guard=0;
 while(p.d<today&&guard++<30){const dd=p.d;const wet=p.w===dd||nwRainDay(dd)&&!(Math.floor(dd/7)%4===3)||farmSpr(x,y);if(wet&&farmSeasonOK(p.c,x,y,dd)&&p.g<def.d){p.g=Math.min(def.d,p.g+(p.f?1.3:1))}p.d++}p.d=today}
function farmStage(p){if(!p.c)return -1;const f=p.g/CROPS[p.c].d;return f>=1?3:f>=.55?2:f>=.25?1:0}
function farmTarget(){const fd=NWS.dir,dx=fd==='l'?-1:fd==='r'?1:0,dy=fd==='u'?-1:fd===0?1:0;const x=Math.floor(NWS.x+dx*.65),y=Math.floor(NWS.y-.35+dy*.65+(dy>0?.2:0));return[x,y]}
function farmTillable(x,y){if(x<2||y<2||x>=NWN-2||y>=NWN-2)return false;const i=farmIdx(x,y);if(NW.sol[i])return false;if(!FARMOK.has(NW.gnd[i]))return false;
 for(const o of NW.byCh[Math.floor(y/NWCH)*NWCN+Math.floor(x/NWCH)]){if(o.x===x&&o.y===y&&o.k!=='lamp')return false;if(o.fw&&x>=o.x-Math.floor(o.fw/2)-0&&x<o.x-Math.floor(o.fw/2)+o.fw&&y>o.y-o.fh&&y<=o.y)return false}return true}

function hsFurnInit(){const P=NWP();if(!P.furn||!P.furn.length&&!P.fi){P.furn=[{i:'bed',x:1,y:1},{i:'table',x:5,y:2},{i:'chair',x:4,y:2},{i:'wardrobe',x:8,y:0},{i:'stove',x:5,y:0},{i:'rug',x:4,y:4},{i:'plant',x:0,y:0}];P.fi={}}if(!P.fi)P.fi={}}
function hsFits(room,f,x,y,ignore){const d=FURN[f];if(d.wall)return y===-1&&x>=0&&x<room.rw&&!room.items.some(q=>q!==ignore&&FURN[q.i].wall&&q.x===x);const x1=x+d.w-1,y0=y-d.h+1;if(x<0||x1>=room.rw||y0<0||y>=room.rh)return false;if(y>=room.rh-1&&x1>=room.dx-1&&x<=room.dx+1)return false;
 for(const q of room.items){if(q===ignore)continue;const e=FURN[q.i];if(e.wall)continue;if(!!e.floor!==!!d.floor)continue;if(x<=q.x+e.w-1&&x1>=q.x&&y0<=q.y&&y>=q.y-e.h+1)return false}return true}
function hsFurnAt(room,x,y){for(const q of room.items){const e=FURN[q.i];if(e.wall)continue;if(x>=q.x&&x<=q.x+e.w-1&&y<=q.y&&y>=q.y-e.h+1&&!e.floor)return q}return null}

function hsRoomFor(o){const P=NWP();let type=o.nm==='home'?'home':o.nm==='hall'?'hall':o.nm==='shop'?'shop':o.nm==='obs'?'lab':o.nm==='mine'?'mine':'vil';const rr={home:[10,7],hall:[12,8],shop:[10,7],lab:[9,7],mine:[8,6],vil:[8,6]}[type];if(type==='mine'&&o.hk==='townhouse')rr[0]=10,rr[1]=7;if(type==='mine'&&o.hk==='cottage')rr[0]=9;
 const room={type,o,rw:rr[0],rh:rr[1],dx:Math.floor(rr[0]/2),items:[],res:[],wall:HWALL[type==='home'?(P.paint||0)%6:(o.x*7+o.y*3)%6],seed:o.x*131+o.y*17,id:o.id};
 if(type==='home'){hsFurnInit();room.items=P.furn;room.edit=true}
 else{const R=mulberry(room.seed);const add=(i,x,y)=>{if(hsFits(room,i,x,y))room.items.push({i,x,y})};
  if(type==='shop'){add('shelf',1,0);add('shelf',7,0);add('plant',0,0);add('rug',3,4);add('lamp',9,0);room.counter=1}
  else if(type==='hall'){add('shelf',1,0);add('shelf',9,0);add('rug',4,5);add('plant',0,0);add('plant',11,0);add('lamp',6,0);add('painting',3,-1);add('painting',8,-1);room.desk=1}
  else if(type==='lab'){add('shelf',1,0);add('rug',3,4);add('lamp',7,0);add('plant',0,0);room.scope=1}
  else{add('bed',1,1);add('table',4,2);add('chair',3,2);add('shelf',5,0);add('plant',0,0);if(R()<.6)add('rug',3,4);if(R()<.5)add('painting',R()<.5?2:6,-1);if(R()<.4)add('lamp',rr[0]-1,0)}}
 /* residents */
 const px=(i)=>({x:2.5+i*1.6,y:Math.min(room.rh-2,2+(i%2))+.5});
 if(type==='shop'){room.res.push({id:'pip',x:room.rw/2,y:1.6,dir:0,fixed:1})}
 else if(type==='hall'){room.res.push({id:'tilda',x:room.rw/2,y:1.5,dir:0,fixed:1})}
 else if(type==='lab'){room.res.push({id:'elio',x:5.5,y:2.5,dir:0,wander:1})}
 else if(type==='vil'||type==='mine'){if(o.nid)room.res.push({id:o.nid,x:5.5,y:3.2,dir:0,wander:1});
  else if(type==='mine'){hsAssign();LF().vil.filter(v=>v.home===o.hid).forEach((v,i)=>{const p=px(i);room.res.push({id:'v:'+v.n,v:v,x:p.x,y:p.y,dir:0,wander:1})})}
  else{const R=mulberry(room.seed+5);const nm=VNAMES[Math.floor(R()*VNAMES.length)];room.res.push({id:'g:'+nm,n:nm,seed:Math.floor(R()*9999),x:5.5,y:3.4,dir:0,wander:1})}}
 return room}

function hsInMove(dt){const R=NWS.in;let dx=(NWS.keys.r?1:0)-(NWS.keys.l?1:0),dy=(NWS.keys.d?1:0)-(NWS.keys.u?1:0);if(!dx&&!dy){dx=NWS.jx;dy=NWS.jy}const m=Math.hypot(dx,dy);NWS.mv=m>.05;if(!NWS.mv){NWS.fr=0;return}if(m>1){dx/=m;dy/=m}
 const sp=4*dt,ok=(x,y)=>{if(x<.28||x>R.rw-.28||y<.45)return false;if(y>R.rh+.2)return false;if(y>R.rh-.02&&Math.abs(x-(R.dx+.5))>.8)return false;const q=hsFurnAt(R,Math.floor(x),Math.floor(y-.25));if(q&&!(FURN[q.i].floor))return false;const q2=hsFurnAt(R,Math.floor(x),Math.floor(y-.02));if(q2)return false;

const SQ={mira:{need:{inv:{berry:3}},rw:{coins:30,inv:{s_strawberry:2}}},marlo:{need:{inv:{fish:3}},rw:{tools:['rod'],coins:20}},wren:{need:{inv:{herb:4}},rw:{tools:['compass'],coins:20}},moss1:{need:{inv:{shroom:3}},rw:{inv:{fertilizer:3},coins:15}},dw1:{need:{inv:{fish:2}},rw:{inv:{s_glowberry:3},coins:25}},dh1:{need:{inv:{cactusfruit:3}},rw:{inv:{s_melon:2},coins:50}},gf1:{need:{inv:{crystal:2}},rw:{inv:{s_frostroot:3},coins:40}},rw1:{need:{inv:{scrap:2}},rw:{inv:{circuit:1},coins:20}}};
const SQIDS=Object.keys(SQ);
async function sqTalk(id){const q=SQ[id],P=NWP();if(!q)return false;if(!P.sq)P.sq={};const st=P.sq[id]||0;if(st>=2)return false;
 if(st===0){await sayL(id,['sq_'+id+'_q']);P.sq[id]=1;toast('📌 '+t('sq_new'));return true}
 if(canCraft(q.need)){await sayL(id,['sq_'+id+'_t']);payCraft(q.need);nwReward(q.rw);P.sq[id]=2;SFX.win();toast('✅ '+t('sq_done'));P.cnt.sqd=(P.cnt.sqd||0)+1;save();return true}
 await sayL(id,['sq_'+id+'_a']);return true}
async function nwTalkNpc(id,n){NWS.qbusy=1;try{const P=NWP();const sc=TK[id];
 if(sc){for(const e of sc){if(e.if()){await sayL(id,e.L);if(e.do)await e.do(n);qAdvance();return}}}
 if(id!=='fenn'&&await sqTalk(id))return;
 /* hints from Fenn */
 if(id==='fenn'){const s=qStep();const hk=s?'q_'+s.id+'_h':null;if(hk&&hasT(hk)){await sayL('fenn',['fn_hint']);await nwSay([{w:'fenn',t:()=>t(hk)}])}else await sayL('fenn',['fn_i'+(1+Math.floor(Math.random()*4))]);return}
 const acts=P.q>=QIDX.bc_rustwick?5:P.q>=QIDX.bjorn?4:P.q>=QIDX.sahra1?3:P.q>=QIDX.nettle1?2:1;const k='nt_'+id+'_'+(1+Math.floor(Math.random()*3));
 let lines=[hasT(k)?k:('nt_act_'+acts)];if(!hasT(k)&&Math.random()<.4)lines=['nt_generic_'+(1+Math.floor(Math.random()*4))];
 if(id==='tilda'||id==='pip'){await sayL(id,lines);const ch=await nwSay([{w:'narr',t:()=>t('nt_what')}],{choices:id==='tilda'?[{t:'🏛️ '+t('nt_hall'),v:1},{t:t('hs_bye'),v:0}]:[{t:'🛒 '+t('nt_shop'),v:1},{t:'💬 '+t('nt_chat'),v:2},{t:t('hs_bye'),v:0}]});
  if(ch===1){NWS.qbusy=0;NWS.busy++;try{if(id==='tilda')openHall();else openShop()}finally{NWS.busy--}}else if(ch===2){NWS.busy++;try{openTalk('pip')}finally{NWS.busy--}}return}
 await sayL(id,lines)}finally{NWS.qbusy=0}}
