<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffd9b8">
<title>Cozy Village Wars (prototype)</title>
<style>
:root{
  --bg:#fdf1dc;--ink:#5a3b2e;--ink2:#9a7762;--panel:#fffaf0;--edge:#f2d9b0;--shade:#e7c791;
  --pink:#ff8fa8;--pink2:#e86a8a;--teal:#5ccfc0;--teal2:#33b0a2;--sky:#6cc3ff;--sky2:#3a9fe6;
  --sun:#ffcf5c;--sun2:#eaa92c;--lilac:#b79cff;--lilac2:#8f72e6;--good:#6bd17f;--good2:#43b45d;--bad:#ff7a85;--bad2:#e0505e;
  --font:"Fredoka","Nunito","Varela Round",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:linear-gradient(160deg,#ffe3c2,#ffd0da 55%,#e6d4ff);font-family:var(--font);color:var(--ink);overflow:hidden}
#app{position:relative;width:100%;max-width:430px;height:100dvh;max-height:940px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:500px) and (min-height:700px){#app{margin-top:calc((100dvh - min(100dvh,940px))/2);border-radius:34px;box-shadow:0 20px 60px rgba(120,60,40,.25),0 0 0 8px #fff7;}}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
/* header */
#top{flex:none;display:flex;align-items:center;gap:5px;padding:8px 8px 6px;background:linear-gradient(#fff6e6,#ffeccb);border-bottom:3px solid var(--edge);z-index:5}
.chip{display:flex;align-items:center;gap:4px;padding:3px 9px 3px 5px;border-radius:99px;background:#fff;border:2px solid var(--edge);font-weight:600;font-size:14px;line-height:1.1;box-shadow:0 2px 0 var(--shade);white-space:nowrap;transition:transform .15s}
.chip .em{font-size:17px}
.chip.bump{animation:bump .35s}
.chip.full{border-color:var(--bad);color:var(--bad2)}
#top .chip{flex:1;justify-content:center;min-width:0;padding:3px 4px}
#gear{flex:none;width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid var(--edge);box-shadow:0 2px 0 var(--shade);font-size:19px;display:grid;place-items:center}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
/* screens */
main{flex:1;position:relative;min-height:0}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.on{display:block}
.scroll{overflow-y:auto;overflow-x:hidden;padding:12px 12px 16px;-webkit-overflow-scrolling:touch}
nav{flex:none;display:flex;gap:4px;padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(#fff3dc,#ffe6bd);border-top:3px solid var(--edge);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 0 3px;border-radius:16px;font-size:11px;font-weight:600;color:var(--ink2);transition:.15s;position:relative}
nav button .ni{font-size:23px;line-height:1.15;transition:transform .2s}
nav button.on{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--shade),inset 0 0 0 2px var(--edge)}
nav button.on .ni{transform:translateY(-2px) scale(1.12)}
nav .dot{position:absolute;top:2px;right:22%;width:10px;height:10px;border-radius:50%;background:var(--pink2);border:2px solid #fff;display:none}
nav .dot.on{display:block;animation:bump 1s infinite}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:16px;font-weight:700;font-size:16px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.18);background:linear-gradient(#7fe08e,var(--good));border-bottom:4px solid var(--good2);transition:transform .08s,filter .15s;position:relative}
.btn:active{transform:translateY(3px);border-bottom-width:1px;margin-bottom:3px}
.btn.pink{background:linear-gradient(#ffa6bb,var(--pink));border-bottom-color:var(--pink2)}
.btn.sun{background:linear-gradient(#ffe083,var(--sun));border-bottom-color:var(--sun2);color:#6b4310;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.sky{background:linear-gradient(#92d5ff,var(--sky));border-bottom-color:var(--sky2)}
.btn.lilac{background:linear-gradient(#cdb9ff,var(--lilac));border-bottom-color:var(--lilac2)}
.btn.ghost{background:#fff;color:var(--ink);text-shadow:none;border:2px solid var(--edge);border-bottom:4px solid var(--shade)}
.btn.small{padding:6px 12px;font-size:14px;border-radius:13px}
.btn.big{padding:14px 20px;font-size:20px;border-radius:20px}
.btn:disabled,.btn.off{filter:grayscale(.85) brightness(1.05);opacity:.65;pointer-events:none}
.card{background:var(--panel);border:3px solid var(--edge);border-radius:22px;box-shadow:0 4px 0 var(--shade);padding:12px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:17px;font-weight:700}
.muted{color:var(--ink2);font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.6px;padding:2px 7px;border-radius:99px;background:var(--lilac);color:#fff;vertical-align:middle;text-transform:uppercase}
.tag.demo{background:var(--sun2)}
.tag.bot{background:var(--lilac2)}
/* village overlays */
#vwrap{position:absolute;inset:0}
#vc{position:absolute;inset:0;width:100%;height:100%;display:block}
#banner{position:absolute;left:8px;right:8px;top:8px;border-radius:18px;padding:6px 12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;background:linear-gradient(90deg,#fff3c4,#ffe0ea);border:3px solid #fff;box-shadow:0 4px 0 rgba(200,140,80,.35),0 8px 18px rgba(120,60,40,.15);z-index:3}
#banner.live{background:linear-gradient(90deg,#ffd166,#ff9fb5,#c7a8ff,#ffd166);background-size:300% 100%;animation:shine 6s linear infinite;color:#4b2a1a}
#banner .bi{font-size:24px;animation:wob 2s ease-in-out infinite}
#banner small{display:block;font-weight:500;opacity:.85;font-size:11px}
@keyframes shine{to{background-position:300% 0}}
@keyframes wob{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.12)}}
#power{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 18px 6px 10px;border-radius:99px;background:linear-gradient(#fffaf0,#ffe9c2);border:3px solid #fff;box-shadow:0 5px 0 var(--shade),0 10px 20px rgba(120,60,40,.2);z-index:3;cursor:pointer;transition:transform .1s}
#power:active{transform:translateX(-50%) scale(.95)}
#power .pi{font-size:30px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
#power b{display:block;font-size:30px;line-height:1;font-weight:700;letter-spacing:.5px;color:#d9506c;text-shadow:0 2px 0 #fff}
#power small{display:block;font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.8px}
#power.pop{animation:bump .5s}
/* sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,1.2,.4,1);padding:0 8px 10px}
#sheet.on{transform:none}
#sheet .in{background:var(--panel);border:3px solid var(--edge);border-radius:26px;box-shadow:0 -6px 30px rgba(120,60,40,.25),0 5px 0 var(--shade);padding:14px;max-height:70dvh;overflow:auto}
#scrim{position:absolute;inset:0;background:rgba(90,50,40,.28);z-index:19;display:none}
#scrim.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sh-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.sh-ico{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:linear-gradient(#fff,#ffeccd);border:3px solid var(--edge);flex:none}
.sh-head h2{margin:0;font-size:21px;line-height:1.1}
.lv{display:inline-block;background:var(--sun);color:#6b4310;border-radius:99px;font-size:12px;font-weight:700;padding:1px 8px;margin-left:6px;vertical-align:middle}
.costs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cost{padding:2px 9px 2px 5px;border-radius:99px;background:#fff;border:2px solid var(--edge);font-weight:600;font-size:14px;display:flex;gap:3px;align-items:center}
.cost.lack{border-color:var(--bad);color:var(--bad2);background:#fff0f1}
.bar{height:14px;border-radius:99px;background:#f3e3c6;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.08)}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(#ffe083,var(--sun));transition:width .25s}
.bar.green>i{background:linear-gradient(#8fe79c,var(--good))}
.bar.pink>i{background:linear-gradient(#ffb0c2,var(--pink))}
.bar.sky>i{background:linear-gradient(#a6dcff,var(--sky))}
.unit{display:flex;align-items:center;gap:8px;padding:8px;border-radius:16px;background:#fff;border:2px solid var(--edge);margin-bottom:6px}
.unit .ui{font-size:28px;width:38px;text-align:center}
.unit .un{font-weight:700;font-size:15px}
.unit.lock{opacity:.55}
.pill{display:inline-flex;gap:3px;align-items:center;font-size:12px;font-weight:600;padding:1px 7px;border-radius:99px;background:#fff;border:2px solid var(--edge)}
/* modal */
#modal{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(90,50,40,.4);padding:18px}
#modal.on{display:flex;animation:fade .2s}
#modal .in{width:100%;max-height:88%;overflow:auto;background:var(--panel);border:3px solid #fff;border-radius:28px;box-shadow:0 12px 40px rgba(60,20,20,.35),0 6px 0 var(--shade);padding:16px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#modal h2{margin:0 0 8px;font-size:22px;text-align:center}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 4px;border-radius:14px;background:#fff;border:2px solid var(--edge);border-bottom-width:4px;font-weight:700;font-size:15px}
.seg button.on{background:var(--sun);border-color:var(--sun2);color:#6b4310}
.sw{width:54px;height:30px;border-radius:99px;background:#e5d6bd;position:relative;transition:.2s;flex:none}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.2);transition:.2s}
.sw.on{background:var(--good)}.sw.on:after{left:27px}
#toasts{position:absolute;left:0;right:0;bottom:84px;z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#fffdf6;border:3px solid var(--edge);border-radius:99px;box-shadow:0 4px 0 var(--shade),0 8px 18px rgba(0,0,0,.15);padding:6px 16px;font-weight:600;font-size:14px;animation:toast 2.6s forwards;max-width:92%;text-align:center}
@keyframes toast{0%{transform:translateY(20px) scale(.8);opacity:0}10%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
/* duel + rank */
.league{display:flex;align-items:center;gap:12px}
.gem{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:32px;border:4px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.12),inset 0 -6px 0 rgba(0,0,0,.1);flex:none}
.big-num{font-size:34px;font-weight:700;line-height:1}
.lb{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:14px;margin-bottom:4px;background:#fff;border:2px solid var(--edge);font-weight:600}
.lb.me{background:linear-gradient(90deg,#fff1b8,#ffd9e3);border-color:var(--sun2);box-shadow:0 3px 0 var(--sun2)}
.lb .rk{width:32px;text-align:center;font-weight:700;color:var(--ink2)}
.lb .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;border:2px solid #fff;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.lb .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ladder{display:flex;justify-content:space-between;gap:4px;margin:10px 0 4px}
.ladder .lg{flex:1;text-align:center;font-size:11px;font-weight:600;opacity:.55}
.ladder .lg.on{opacity:1}
.ladder .lg .gem{width:46px;height:46px;font-size:22px;margin:0 auto 2px}
.ladder .lg.on .gem{box-shadow:0 0 0 3px var(--sun),0 4px 10px rgba(255,180,60,.5)}
.ladder .lg .gem{margin-bottom:6px!important}
/* battle overlay */
#bu{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;background:linear-gradient(#cfeeff,#fdf1dc 40%)}
#bu.on{display:flex}
.bu-top{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(#fff6e6,#ffeccb);border-bottom:3px solid var(--edge)}
.bu-top .tt{flex:1;font-weight:700;font-size:15px;line-height:1.15;min-width:0}
#bc{flex:none;width:100%;display:block;background:#cde}
.bu-bars{flex:none;display:flex;gap:10px;padding:8px 10px 4px}
.bu-bars>div{flex:1;min-width:0}
.bu-bars .nm{font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:4px;white-space:nowrap}
.bu-bars .nm span:first-child{overflow:hidden;text-overflow:ellipsis}
.bu-bars .cnt{font-size:12px;font-weight:600;color:var(--ink2);margin-top:2px;display:flex;gap:6px}
.bu-panel{flex:1;min-height:0;overflow:auto;padding:6px 10px 12px}
.form-row{display:flex;gap:6px}
.form{flex:1;padding:7px 4px;border-radius:16px;background:#fff;border:3px solid var(--edge);text-align:center;font-weight:700;font-size:12.5px;line-height:1.15;transition:.15s}
.form .fi{font-size:26px;display:block}
.form small{display:block;font-weight:500;color:var(--ink2);font-size:10.5px;margin-top:2px}
.form.on{border-color:var(--sun2);background:#fff4cc;transform:translateY(-3px);box-shadow:0 4px 0 var(--sun2)}
.tac{flex:1;padding:8px 4px;border-radius:18px;background:#fff;border:3px solid var(--edge);border-bottom-width:6px;text-align:center;font-weight:700;font-size:14px;transition:transform .08s}
.tac:active{transform:translateY(3px);border-bottom-width:3px}
.tac .fi{font-size:30px;display:block}
.tac small{display:block;font-weight:500;color:var(--ink2);font-size:11px}
.tac.c-charge{background:#ffe7ea;border-color:#ffb3be}.tac.c-hold{background:#e3f4ff;border-color:#a8d9fb}.tac.c-focus{background:#fff3cf;border-color:#ffd77a}
.tac.hint{outline:4px solid var(--good);animation:bump .9s infinite}
.cardrow{display:flex;gap:6px;margin:8px 0}
.cbtn{flex:1;padding:5px 2px;border-radius:14px;background:#fff;border:3px solid var(--edge);text-align:center;font-size:11px;font-weight:600;line-height:1.1;position:relative}
.cbtn .fi{font-size:24px;display:block}
.cbtn .n{position:absolute;top:-6px;right:-3px;background:var(--pink2);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;border:2px solid #fff}
.cbtn.on{border-color:var(--lilac2);background:#efe7ff;transform:translateY(-3px);box-shadow:0 4px 0 var(--lilac2)}
.cbtn.off{opacity:.4;pointer-events:none}
.bigbanner{text-align:center;font-size:34px;font-weight:700;margin:2px 0;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.bigbanner.win{color:#e8a31d;text-shadow:0 3px 0 #fff,0 6px 0 rgba(200,140,40,.3)}
.bigbanner.lose{color:#8a7aa8;text-shadow:0 3px 0 #fff}
.logline{text-align:center;font-weight:600;font-size:14px;min-height:20px;margin:4px 0}
.sl{width:100%;accent-color:var(--pink2)}
.sli{display:flex;align-items:center;gap:6px;margin:2px 0;font-weight:600;font-size:14px}
.sli .ui{font-size:22px;width:28px;text-align:center}
.sli input{flex:1}
.sli .val{width:56px;text-align:right}
/* war */
#wc{position:absolute;left:0;display:block}
.w-hud{position:absolute;left:6px;right:6px;top:5px;display:flex;gap:5px;align-items:center;z-index:2}
.w-hud .chip{font-size:13px;padding:3px 8px 3px 5px}
.ap{display:flex;gap:3px;padding:4px 7px;border-radius:99px;background:#fff;border:2px solid var(--edge);box-shadow:0 2px 0 var(--shade)}
.ap i{width:14px;height:14px;border-radius:50%;background:var(--sun);border:2px solid var(--sun2);transition:.2s}
.ap i.u{background:#eadcc4;border-color:#d8c6a6;transform:scale(.8)}
.w-bottom{position:absolute;left:0;right:0;bottom:0;padding:4px 6px 6px;z-index:2;background:linear-gradient(transparent,var(--bg) 18%)}
.w-info{background:var(--panel);border:3px solid var(--edge);border-radius:18px;padding:6px 10px;box-shadow:0 3px 0 var(--shade);min-height:62px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.w-info .big{font-size:30px;flex:none}
.w-actions{display:flex;gap:5px;margin-top:6px}
.w-actions .btn{flex:1;padding:7px 2px;font-size:12px;flex-direction:column;gap:0;line-height:1.1;border-radius:14px}
.w-actions .btn .bi{font-size:19px}
.w-actions .btn.end{flex:1.35}
.setup .opt{margin:8px 0}
.setup .opt>div:first-child{font-weight:700;margin-bottom:4px}
.passscreen{position:absolute;inset:0;z-index:45;background:linear-gradient(160deg,#ffd9b8,#ffc2d4,#d9c8ff);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center}
.passscreen.on{display:flex}
.passscreen h1{margin:0;font-size:30px}
.evl{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:2px dashed var(--edge);font-size:14px;font-weight:600}
.evl:last-child{border:0}
#busyov{position:absolute;left:10px;right:10px;top:48px;z-index:6;background:#fffdf6ee;border:3px solid var(--edge);border-radius:18px;padding:8px 12px;font-weight:600;font-size:13px;display:none}
#busyov.on{display:block}
.confetti{position:absolute;pointer-events:none;inset:0;z-index:50;overflow:hidden}
/* ===== 6-tab nav ===== */
nav button{font-size:10.5px;min-width:0}nav button .nl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}nav button .ni{font-size:21px}
.pill img.cimg,.cimg{width:1.35em;height:1.35em;vertical-align:-.3em;image-rendering:auto}
.card img.cimg{width:34px;height:34px}
/* ===== explore ===== */
#s-explore{background:#2d5a3a}
.xwrap{position:absolute;inset:0;display:flex;flex-direction:column}
.xmapbox{position:relative;flex:1;min-height:0;overflow:hidden;background:#3d7a45}
.xmap{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
.xmap canvas{display:block;margin:0 auto;image-rendering:pixelated;touch-action:pan-y pan-x}
.xtop{position:absolute;left:6px;top:6px;display:flex;gap:5px;pointer-events:none;z-index:2;flex-wrap:wrap}
.xtop .chip{font-size:12px;padding:2px 9px;background:#fffbe8ee}
.xpanel{flex:none;max-height:46%;overflow:auto;padding:8px 8px 6px;background:linear-gradient(#fff3dc,#ffe6bd);border-top:3px solid var(--edge)}
.xpanel .card{margin-bottom:6px;padding:8px 10px}
.xname{font-size:20px;font-weight:700;line-height:1.1}
.skulls{font-size:13px;letter-spacing:-2px}
.xsp{display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:600;width:48px}.xsp img{width:36px;height:36px}.xsp.unk{opacity:.55}
.xclaim{background:linear-gradient(#fff6c8,#ffe9a0)!important;border-color:var(--sun2)!important;animation:bump 1.2s infinite}
.btn small{font-size:12px;opacity:.85;font-weight:600}
.rbanner{position:absolute;left:0;right:0;top:38px;display:flex;justify-content:center;pointer-events:none;z-index:6}
.rbanner .rb{opacity:0;padding:5px 30px 7px;background:linear-gradient(#fff8e6,#f6dfae);border:3px solid #5a3b2e;border-radius:4px;box-shadow:0 0 0 2px #fff8e6,0 5px 0 #3a2a22;text-align:center;position:relative}
.rbanner .rb:before,.rbanner .rb:after{content:"❖";position:absolute;top:50%;transform:translateY(-50%);color:#c9462c;font-size:14px}.rbanner .rb:before{left:9px}.rbanner .rb:after{right:9px}
.rbanner .rb b{display:block;font-size:21px;letter-spacing:.4px;line-height:1.1}.rbanner .rb small{display:block;font-size:10.5px;color:var(--ink2);font-weight:600}
.rbanner.go .rb{animation:rban 2.8s ease both}
@keyframes rban{0%{transform:translateY(-34px) scale(.92);opacity:0}12%{transform:none;opacity:1}78%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.rbanner-in{margin:-4px auto 8px;width:max-content;max-width:100%;padding:3px 22px;background:linear-gradient(#fff8e6,#f6dfae);border:3px solid #5a3b2e;border-radius:4px;font-weight:700;font-size:15px;box-shadow:0 3px 0 #3a2a22}

function tone(f,d,type='sine',vol=.07,slide=0,delay=0){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+d+.05)}catch(e){}}
function noise(d,vol=.05,delay=0,lp=1200){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime+delay,n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=lp;g.gain.value=vol;s.connect(f).connect(g).connect(AC.destination);s.start(t0)}catch(e){}}
const SFX={
  tap:()=>tone(660,.09,'triangle',.06,300),pop:()=>{tone(520,.12,'sine',.07,500)},
  coin:()=>{tone(988,.08,'square',.03);tone(1319,.14,'square',.03,0,.07)},
  build:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.07,0,i*.08)),
  err:()=>tone(200,.18,'sawtooth',.04,-60),
  clash:()=>{noise(.18,.08,0,900);tone(120,.15,'sine',.1,-60)},
  hit:()=>{noise(.08,.04,0,2200)},
  win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.08,0,i*.1)),
  lose:()=>[440,392,330,262].forEach((f,i)=>tone(f,.35,'sine',.07,0,i*.14)),
  storm:()=>{noise(.8,.07,0,500);tone(90,.8,'sawtooth',.04,-30)},

const LANGS={en:'English',tr:'Türkçe',de:'Deutsch'};
function detectLang(){const l=((navigator.languages&&navigator.languages[0])||navigator.language||'en').slice(0,2).toLowerCase();return LANGS[l]?l:'en'}
if(!S.lang)S.lang=detectLang();
function t(k,p){let s=(I18N[S.lang]&&I18N[S.lang][k]);if(s==null)s=I18N.en[k];if(s==null)s=k;return p?s.replace(/\{(\w+)\}/g,(m,x)=>p[x]!=null?p[x]:m):s}

/* ============ TOAST / MODAL / SHEET ============ */
function toast(msg){const e=h('div','toast',msg);$('#toasts').appendChild(e);setTimeout(()=>e.remove(),2700);while($('#toasts').children.length>3)$('#toasts').firstChild.remove()}
let modalCb=null;
function modal(html,onClose){const m=$('#modal');$('.in',m).innerHTML=html;m.classList.add('on');modalCb=onClose||null;return $('.in',m)}
function closeModal(){const m=$('#modal');m.classList.remove('on');const cb=modalCb;modalCb=null;cb&&cb()}
$('#modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal'&&!$('#modal .in').dataset.lock)closeModal()});
let sheetKey=null,sheetFn=null;
function openSheet(fn){sheetFn=fn;sheetKey=null;$('#scrim').classList.add('on');$('#sheet').classList.add('on');renderSheet(true)}
function closeSheet(){sheetFn=null;$('#scrim').classList.remove('on');$('#sheet').classList.remove('on')}
function renderSheet(force){if(!sheetFn)return;const r=sheetFn();if(force||r.sig!==sheetKey){sheetKey=r.sig;const sc=$('#sheet .in').scrollTop;$('#sheet .in').innerHTML=r.html;$('#sheet .in').scrollTop=sc;r.bind&&r.bind($('#sheet .in'))}else r.live&&r.live($('#sheet .in'))}
$('#scrim').addEventListener('pointerdown',closeSheet);

/* ============ ECONOMY ============ */
function isWeekend(){const d=new Date().getDay();return S.forceWeekend||d===0||d===6}
const wkMult=()=>isWeekend()?2:1;
const thLvl=()=>S.b.townhall.lvl;
const capOf=()=>400+350*(thLvl()-1)+(window.carryBonus?carryBonus():0);
const rateOf=id=>2*Math.pow(1.3,S.b[id].lvl-1)*(1+(window.creatBonus?creatBonus(id):0))*(S.bless&&S.bless[id]?1.3:1);
const popCap=()=>10+['house1','house2','house3'].reduce((a,i)=>a+S.b[i].lvl*10+(S.bless&&S.bless[i]?10:0),0);
const troopTotal=(a=S.troops)=>a.spear+a.archer+a.knight;
const popUsed=()=>troopTotal()+S.queue.length;
const armyPower=(a=S.troops)=>Math.round(TYPES.reduce((s,k)=>s+a[k]*UN[k].pw,0)*(1+.05*(S.b.barracks.lvl-1)));
function upCost(id){const ty=bType(id),L=S.b[id].lvl,m=Math.pow(1.75,L-1),c={};for(const k in BD[ty].base)c[k]=Math.round(BD[ty].base[k]*m/5)*5;return c}
const upTime=id=>Math.round(BD[bType(id)].time*Math.pow(S.b[id].lvl,1.5));
const maxLvlNow=id=>id==='townhall'?BD.townhall.max:Math.min(BD[bType(id)].max,thLvl()+1);
const building=id=>S.b[id];
const builders=()=>Object.values(S.b).filter(b=>b.up).length;
const canAfford=c=>Object.keys(c).every(k=>S.res[k]>=c[k]);
function upgradeState(id){const b=S.b[id],ty=bType(id);
  if(b.up)return{ok:false,why:'busy'};
  if(b.lvl>=BD[ty].max)return{ok:false,why:'max'};
  if(b.lvl>=maxLvlNow(id))return{ok:false,why:'th',need:thLvl()+1};
  if(builders()>=2)return{ok:false,why:'builders'};
  const c=upCost(id);if(!canAfford(c))return{ok:false,why:'res',cost:c};
  return{ok:true,cost:c}}
function startUpgrade(id){const u=upgradeState(id);if(!u.ok){SFX.err();return false}
  for(const k in u.cost)S.res[k]-=u.cost[k];const d=upTime(id)*1000;S.b[id].up={end:Date.now()+d,dur:d};SFX.pop();vBounce(id);vSparkBuilding(id,'dust');save();return true}
function tapHelp(id){const b=S.b[id];if(!b.up)return;b.up.end-=1000;SFX.tap();vBounce(id,.5);vSparkBuilding(id,'dust',4);if(b.up.end<=Date.now())tick()}
function enqueueUnit(ty,n){let ok=0;for(let i=0;i<n;i++){const u=UN[ty];if(S.b.barracks.lvl<u.need||popUsed()>=popCap()||!canAfford(u.cost))break;
  for(const k in u.cost)S.res[k]-=u.cost[k];const last=S.queue.length?S.queue[S.queue.length-1].end:Date.now(),start=Math.max(last,Date.now()),d=u.time*1000/(1+.15*(S.b.barracks.lvl-1));
  S.queue.push({ty,end:start+d,dur:d});ok++}
  if(ok){SFX.pop();vBounce('barracks')}else SFX.err();save();return ok}
let lastTick=Date.now(),lastBump={};
function tick(){const now=Date.now();let dt=Math.min((now-lastTick)/1000,3600);lastTick=now;
  const m=wkMult(),cap=capOf();
  for(const id of['farm','mill','mine']){const r=BD[bType(id)].res,add=rateOf(id)*dt*m;const before=S.res[r];S.res[r]=Math.min(cap,S.res[r]+add);if(isWeekend()&&m>1)S.stats.weekend+=Math.max(0,S.res[r]-before)/2}
  for(const id in S.b){const b=S.b[id];if(b.up&&b.up.end<=now){b.up=null;b.lvl++;SFX.build();vBounce(id,1.4);vSparkBuilding(id,'star',26);toast(t('upDone',{n:t('b_'+bType(id)),l:b.lvl}));if(sheetFn)renderSheet(true);updateNavDot()}}
  while(S.queue.length&&S.queue[0].end<=now){const q=S.queue.shift();S.troops[q.ty]++;SFX.hit();vBounce('barracks',.6);pwPop()}
  updateHeader();if(sheetFn)renderSheet();if(tab==='village')updateBanner();}
function updateHeader(){
  for(const r of RES){const e=$('#c-'+r),v=Math.floor(S.res[r]);const sp=$('.v',e);if(sp.textContent!==fmt(v)){const old=lastBump[r]||0;sp.textContent=fmt(v);if(v>old+0&&Date.now()-(lastBump[r+'t']||0)>900){e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump');lastBump[r+'t']=Date.now()}lastBump[r]=v}e.classList.toggle('full',v>=capOf())}
  const p=$('#c-pop .v'),s=popUsed()+'/'+popCap();if(p.textContent!==s)p.textContent=s;
  const pw=armyPower();if(+$('#pw-n').dataset.v!==pw){$('#pw-n').dataset.v=pw;countTo($('#pw-n'),pw)}}
function countTo(el,to,dur=500){const from=+el.dataset.shown||0;el.dataset.shown=to;const t0=performance.now();(function f(n){const k=clamp((n-t0)/dur,0,1);el.textContent=fmt(lerp(from,to,easeOut(k)));if(k<1)requestAnimationFrame(f)})(t0)}
function pwPop(){const p=$('#power');p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop')}

/* ---- state & care ---- */
let _uid=1;
function newCreature(id){const mx=Math.max(0,...S.creatures.map(c=>c.uid||0));return{uid:mx+1,id,lv:1,xp:0,job:null,hp:100,fed:70,joy:70,en:100,pet:0}}
const cOwned=id=>S.creatures.filter(c=>c.id===id);
const cNeed=c=>c.lv*4;
const cMaxLv=5;
function cCond(c){const f=c.fed>12?(.5+.5*c.joy/100):.3;return f*(c.en>10?1:.55)*(c.hp>25?1:.6)}
function cMood(c){return c.fed<18?'sad':c.en<12?'sleep':c.joy<30?'sad':'happy'}
function cBase(c){return .12+.06*(c.lv-1)}
function slotOf(id){return SLOTS.find(s=>s.id===id)}
function cJobBonus(c,slotId){const sl=slotOf(slotId),sp=SP[c.id],b=cBase(c)*cCond(c);
  if(slotId==='barracks')return sp.role==='guard'?b*1.6:sp.role==='heal'?0:b*.4;
  if(slotId==='townhall')return sp.role==='carry'?b*1.6:b*.3;
  return sp.role===sl.role?b*1.6:b*.55}
function creatBonus(id){const c=S.creatures.find(c=>c.job===id);return c?cJobBonus(c,id):0}
function carryBonus(){const c=S.creatures.find(c=>c.job==='townhall');return (c?Math.round(cJobBonus(c,'townhall')*500):0)+(typeof storeBonus==='function'?storeBonus():0)}
function guardMul(){const c=S.creatures.find(c=>c.job==='barracks');return c?1+cJobBonus(c,'barracks')*.8:1}
function healFrac(){const c=S.creatures.find(c=>c.job==='barracks'&&SP[c.id].role==='heal');return c?Math.min(.85,.4+(.2+.05*c.lv)*cCond(c)):.4}
function myBonus(){const b=thBonus(thLvl());return{atk:b.atk*guardMul()*(S.tools.sword?1.06:1)*(typeof techAtk==='function'?techAtk():1),t:b.t*(typeof techDef==='function'?techDef():1)}}
let _cl=Date.now();
function creatTick(){const now=Date.now(),dt=Math.min((now-_cl)/1000,6*3600);_cl=now;if(dt<=0)return;
  S.creatures.forEach(c=>{const work=!!c.job;c.fed=clamp(c.fed-dt*(work?.034:.022),0,100);
    c.joy=clamp(c.joy-dt*(c.fed<30?.012:.003)+(c.fed>60&&!work?dt*.002:0),0,100);
    c.en=clamp(c.en+(work?-dt*.03:dt*.09),0,100);
    if(c.fed<=0)c.hp=Math.max(12,c.hp-dt*.03);else c.hp=Math.min(100,c.hp+dt*(c.fed>40?.03:0))})}

const cName=id=>t('sp_'+id);
function giveCreature(id,fromEvent){const own=cOwned(id);
  if(own.length){const c=own[0];addXp(c,2);c.joy=Math.min(100,c.joy+15);save();return{dup:true,c}}
  const c=newCreature(id);S.creatures.push(c);S.ex.seen[id]=1;save();return{dup:false,c}}

function cardCreature(k){const l=S.creatures.filter(c=>SP[c.id].card===k&&c.hp>=25).sort((a,b)=>b.lv-a.lv);return l[0]||null}
function cardIco(k){const c=cardCreature(k);return c?`<img class="cimg" src="${creatImg(c.id,40)}" alt="">`:CARDS[k].ico}

function companionUsed(k){const c=cardCreature(k);if(!c)return;c.en=Math.max(0,c.en-14);c.hp=Math.max(12,c.hp-6);c.joy=Math.min(100,c.joy+4);addXp(c,1)}

const SELLP={fiber:3,herb:5,ore:8,shroom:6,reed:3,fish:6,relic:28,stew:20,tea:14,pie:24};
const BUYP={fiber:7,herb:11,ore:17,reed:7};
const BUYRES={food:[40,16],wood:[40,16],stone:[30,16]};
const DISH={stew:'🍲',tea:'🍵',pie:'🥧'};
const ALLI={...ITEMS,...DISH};
const isMarketDay=()=>{const d=new Date().getDay();return d===6||d===0||!!S.forceWeekend};
const frLvl=id=>Math.min(5,Math.floor((S.fr[id]||0)/10));
const heartsStr=id=>{const n=frLvl(id);return'♥'.repeat(n)+'♡'.repeat(5-n)};
const shopDisc=()=>1-.03*frLvl('pip');
const sellMul=()=>(isMarketDay()?1.25:1)+.02*frLvl('pip')+(typeof LF==='function'&&LF().tech.market?.1:0);
function addCoins(n){S.coins=Math.max(0,(S.coins||0)+n)}
function addFr(id,n){const o=frLvl(id);S.fr[id]=Math.min(50,(S.fr[id]||0)+n);if(frLvl(id)>o){toast('💗 '+t('heartUp',{n:t('npc_'+id)}));SFX.win()}}
/* ---- shop ---- */
function openShop(tabSel){let mode=tabSel||'buy';
  const draw=()=>{const m=modal(`<h2>🛖 ${t('tradingPost')}</h2>
   <div class="row" style="justify-content:center;gap:8px;margin-bottom:6px"><span class="pill">🪙 ${fmt(S.coins)}</span>${isMarketDay()?`<span class="pill" style="background:#ffe6a0">🎪 ${t('marketDay')} +25%</span>`:`<span class="pill">🎪 ${t('marketHint')}</span>`}<span class="pill hearts">${heartsStr('pip')}</span></div>
   <div class="xtabs"><button data-m="buy" class="${mode==='buy'?'on':''}">🛒 ${t('buy')}</button><button data-m="sell" class="${mode==='sell'?'on':''}">💰 ${t('sell')}</button></div>
   <div id="shl"></div><button class="btn grow" id="cls" style="width:100%;margin-top:6px">${t('close')}</button>`);
   const list=$('#shl',m);
   if(mode==='buy'){list.innerHTML=Object.keys(BUYRES).map(r=>{const[q,p]=BUYRES[r];const pr=Math.round(p*shopDisc());return`<div class="shoprow"><span style="font-size:22px">${RICO[r]}</span><b class="grow">${t('res_'+r)} ×${q}</b><button class="btn small sun ${S.coins<pr?'off':''}" data-b="r:${r}">🪙 ${pr}</button></div>`}).join('')+
     Object.keys(BUYP).map(i=>{const pr=Math.round(BUYP[i]*shopDisc());return`<div class="shoprow"><span style="font-size:22px">${ITEMS[i]}</span><b class="grow">${t('it_'+i)} <small class="muted">×${S.inv[i]||0}</small></b><button class="btn small sun ${S.coins<pr?'off':''}" data-b="i:${i}">🪙 ${pr}</button></div>`}).join('')+
     `<div class="shoprow"><span style="font-size:22px">💎</span><b class="grow">${t('gemName')}</b><button class="btn small lilac ${S.coins<Math.round(110*shopDisc())?'off':''}" data-b="g:1">🪙 ${Math.round(110*shopDisc())}</button></div>`}
   else{const rows=[];Object.keys(S.inv).forEach(i=>{if(S.inv[i]>0&&SELLP[i])rows.push({k:i,n:S.inv[i],p:Math.round(SELLP[i]*sellMul()),ico:ALLI[i],nm:t('it_'+i)})});
     RES.forEach(r=>{if(S.res[r]>=20)rows.push({k:'res:'+r,n:S.res[r],p:Math.round(6*sellMul()),ico:RICO[r],nm:t('res_'+r)+' ×20'})});
     list.innerHTML=rows.length?rows.map(o=>`<div class="shoprow"><span style="font-size:22px">${o.ico}</span><b class="grow">${o.nm} <small class="muted">×${o.n}</small></b><button class="btn small sun" data-s="${o.k}">🪙 ${o.p}</button></div>`).join(''):`<div class="muted" style="text-align:center;padding:12px">${t('nothingSell')}</div>`}
   $$('[data-m]',m).forEach(b=>b.onclick=()=>{mode=b.dataset.m;SFX.tap();draw()});
   $$('[data-b]',m).forEach(b=>b.onclick=()=>{const[ty,k]=b.dataset.b.split(':');let pr;
     if(ty==='r'){pr=Math.round(BUYRES[k][1]*shopDisc());if(S.coins<pr)return;addCoins(-pr);S.res[k]=Math.min(capOf(),S.res[k]+BUYRES[k][0])}
     else if(ty==='i'){pr=Math.round(BUYP[k]*shopDisc());if(S.coins<pr)return;addCoins(-pr);S.inv[k]=(S.inv[k]||0)+1}
     else{pr=Math.round(110*shopDisc());if(S.coins<pr)return;addCoins(-pr);S.gems++}
     SFX.coin();addFr('pip',.4);save();updateHeader();draw()});
   $$('[data-s]',m).forEach(b=>b.onclick=()=>{const k=b.dataset.s;let p;
     if(k.startsWith('res:')){const r=k.slice(4);if(S.res[r]<20)return;S.res[r]-=20;p=Math.round(6*sellMul())}else{if(!S.inv[k])return;S.inv[k]--;p=Math.round(SELLP[k]*sellMul())}
     addCoins(p);S.stats.sold=(S.stats.sold||0)+1;SFX.coin();addFr('pip',.2);save();updateHeader();draw()});
   $('#cls',m).onclick=closeModal};
  draw()}
/* ---- dialogue ---- */
const NPC={pip:{ico:'🦝',home:'lantern'}};
function runDlg(id,node){const n=NPC[id];const sayKey=node;
  const ch=[];const add=(k,fn,c)=>ch.push({k,fn,c});
  let say=t(sayKey,{h:heartsStr(id)});
  if(node==='pip_start'){say=t(frLvl(id)>=3?'pip_hi3':frLvl(id)>=1?'pip_hi1':'pip_hi0');
    add(t('dTrade'),()=>{closeModal();openShop()},'sun');
    add(t('dRumor'),()=>runDlg(id,'pip_rumor'));
    add(t('dAbout'),()=>runDlg(id,frLvl(id)>=2?'pip_story2':'pip_story1'));
    if(S.inv.pie>0)add('🥧 '+t('dGift'),()=>{S.inv.pie--;addFr(id,10);addCoins(12);save();updateHeader();runDlg(id,'pip_thanks')},'pink');
    add(t('dBye'),()=>closeModal(),'ghost')}
  else if(node==='pip_rumor'){const r=1+Math.floor(Math.random()*5);say=t('pip_r'+r);add(t('dThanks'),()=>runDlg(id,'pip_start'));}
  else if(node==='pip_thanks'){add(t('dOk'),()=>runDlg(id,'pip_start'))}
  else if(node==='pip_story1'||node==='pip_story2'){add(t('dNice'),()=>runDlg(id,'pip_start'))}
  const m=modal(`<div class="dlg"><div class="av">${n.ico}</div><div class="grow"><b>${t('npc_'+id)}</b> <span class="hearts" style="color:#e86a8a">${heartsStr(id)}</span><div class="tx" style="margin-top:4px">${say}</div></div></div><div class="dch">${ch.map((c,i)=>`<button class="btn ${c.c||'sky'} small" data-i="${i}" style="justify-content:flex-start;text-align:left">${c.k}</button>`).join('')}</div>`);
  $$('[data-i]',m).forEach(b=>b.onclick=()=>{SFX.tap();ch[+b.dataset.i].fn()})}
function openTalk(id){const today=new Date().toDateString();if(S.fday[id]!==today){S.fday[id]=today;addFr(id,5);addCoins(frLvl(id)>=2?6:2);toast('🪙 +'+(frLvl(id)>=2?6:2));updateHeader()}save();runDlg(id,id+'_start')}

/* --- pixel lantern-fox sprite (24x24, drawn procedurally with auto outline) --- */
function foxSprite(cv,blink){const W=24,g=cv.getContext('2d');cv.width=W;cv.height=W;g.clearRect(0,0,W,W);
  const px=[];for(let y=0;y<W;y++){px.push(new Array(W).fill(null))}
  const set=(x,y,c)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<W&&y<W)px[y][x]=c};
  const fillE=(cx,cy,rx,ry,c)=>{for(let y=0;y<W;y++)for(let x=0;x<W;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)set(x,y,c)}};

/* ============ LIFE: villagers, quests, seasons, festivals, tech, achievements, events, NPC talk ============ */
const DAYMS=300000;
function LF(){if(!S.life){S.life={t0:Date.now(),vil:[],homes:2,tax:1,pot:0,potT:Date.now(),store:0,q:{list:[],story:0,done:0,base:{}},tech:{},ach:{},cnt:{},ev:Date.now()+90000,fest:0,festEnd:0,seenFest:-1,mood:0};
  S.life.vil.push(newVillager('farmer'),newVillager('lumber'))}
  const l=S.life;if(!l.q.list.length)for(let i=0;i<3;i++)l.q.list.push(genQuest());return l}
const avgMood=()=>{const v=LF().vil;return v.length?v.reduce((a,x)=>a+x.mood,0)/v.length:0};
const gDay=()=>Math.floor((Date.now()-LF().t0)/DAYMS);
const gPhase=()=>(((Date.now()-LF().t0)/DAYMS)%1+1)%1;
const SEAS=['spring','summer','autumn','winter'],SEA_ICO=['🌸','☀️','🍂','❄️'];
const seasonIdx=()=>Math.floor(gDay()/7)%4,seasonId=()=>SEAS[seasonIdx()],seasonIco=()=>SEA_ICO[seasonIdx()];
const dayOfSeason=()=>gDay()%7,isFestDay=()=>dayOfSeason()===6;
const festActive=()=>isFestDay()||LF().festEnd>Date.now();
function seasonTint(){return['rgba(255,170,210,.05)','rgba(255,230,110,.06)','rgba(255,130,40,.1)','rgba(170,205,255,.16)'][seasonIdx()]}
const SFXP=[];for(let i=0;i<46;i++)SFXP.push({x:Math.random()*400,y:Math.random()*400,s:.5+Math.random(),p:Math.random()*6});
function seasonFx(g,t){const s=seasonIdx(),cx=RO.cx-RO.W/RO.z/2,cy=RO.cy-RO.H/RO.z/2,vw=RO.W/RO.z,vh=RO.H/RO.z;
  if(s===1)return;const col=s===0?['#ffc0d8','#fff']:s===2?['#e8873a','#d6572a','#f2b84a']:['#fff','#e8f4ff'];
  SFXP.forEach((p,i)=>{const fall=s===3?9:s===2?6:4,drift=s===3?2:s===2?5:3;const x=cx+((p.x+Math.sin(t*.7+p.p)*8+t*drift*p.s)%(vw+8)),y=cy+((p.y*.6+t*fall*p.s)%(vh+8));g.fillStyle=col[i%col.length];g.globalAlpha=.85;g.fillRect(Math.round(x),Math.round(y),s===3?1:2,1);if(s!==3)g.fillRect(Math.round(x)+1,Math.round(y)+1,1,1);g.globalAlpha=1})}
const seasonMul=r=>{const s=seasonIdx();if(r==='food')return[1.2,1,1.1,.75][s];if(r==='wood')return[1,1,1.1,.9][s];if(r==='stone')return[1,1,1,1.05][s];return 1};
const techMul=r=>{const T=LF().tech;return 1+(r==='wood'&&T.saws?.15:0)+(r==='food'&&T.plow?.15:0)+(r==='stone'&&T.chisel?.15:0)};
function lootMul(k){return techMul(k)}
const storeBonus=()=>LF().store*250+(LF().tech.granary?300:0);
const repLvl=()=>{const r=S.rep||0;return r>=300?4:r>=140?3:r>=60?2:r>=20?1:0};
const REPT=[0,20,60,140,300];

/* ---- villagers ---- */
const VNAMES=['Wren','Bramble','Maple','Pepper','Juniper','Biscuit','Clover','Mossy','Poppy','Thistle','Hazel','Tansy','Rowan','Sorrel','Dilly','Fern','Cobble','Nutmeg','Willow','Puck','Sage','Tulip','Basil','Ginger'];
const JOBS={farmer:{ico:'🌾',res:'food'},lumber:{ico:'🪵',res:'wood'},miner:{ico:'⛏️',res:'stone'},fisher:{ico:'🎣',res:'food',item:'fish'},baker:{ico:'🥖',res:'coin'},guard:{ico:'🛡️',res:null},merchant:{ico:'💰',res:'tax'}};

const WISHES=[{res:{food:40}},{res:{wood:40}},{res:{stone:30}},{item:{herb:2}},{item:{fish:2}},{item:{fiber:3}},{item:{shroom:2}},{item:{reed:2}},{item:{stew:1}},{item:{tea:1}},{item:{pie:1}}];

let lifeLast=Date.now();
function lifeTick(){const l=LF(),now=Date.now(),dt=Math.min(14400,(now-lifeLast)/1000);lifeLast=now;if(dt<=0)return;
  const th=1+.25*(thLvl()-1),cap=capOf();let moodSum=0;
  l.vil.forEach(v=>{v.mood+=clamp(moodTarget(v)-v.mood,-dt*1.5,dt*1.5);moodSum+=v.mood;
    if(!v.wish&&v.wt<now){const pw=pick(WISHES);v.wish=JSON.parse(JSON.stringify(pw));v.wt=now}
    const J=JOBS[v.job],mm=.6+v.mood/100*.8;
    if(J.res&&J.res!=='coin'&&J.res!=='tax'){const add=dt/60*4*th*mm*seasonMul(J.res)*techMul(J.res);S.res[J.res]=Math.min(cap,S.res[J.res]+add);if(J.item&&Math.random()<dt/60*.25)S.inv.fish=(S.inv.fish||0)+1}

  l.mood=l.vil.length?moodSum/l.vil.length:0;
  // taxes
  const rate=[0,.6,1.2,2.4][l.tax],merch=l.vil.filter(v=>v.job==='merchant').length;l.pot=Math.min(120+l.homes*60,l.pot+dt/60*l.vil.length*rate*(1+.2*(thLvl()-1))*(1+.25*merch)*(festActive()?2:1)*(l.tech.banners?1.2:1));
  // newcomers
  if(l.vil.length<popCapL()&&Math.random()<dt/90*Math.min(1,.4+l.mood/100)){const v=newVillager();l.vil.push(v);toast('👋 '+t('newcomer',{n:v.n,j:t('job_'+v.job)}));SFX.pop()}
  // festival notice
  const gd=gDay();if(isFestDay()&&l.seenFest!==gd){l.seenFest=gd;l.cnt.fest=(l.cnt.fest||0)+1;toast('🎉 '+t('fest_'+seasonId()));SFX.win();addRep(3);achCheck()}
  lifeEventMaybe();updateBtns()}

L("d_brunna_hi","Mind the dust! Brunna's the name, rocks are my game.","Toza dikkat! Adım Brunna, işim kaya.","Vorsicht, Staub! Ich bin Brunna, Steine sind mein Ding.");L("d_brunna_q","Is mining hard work?","Madencilik zor mu?","Ist Bergbau harte Arbeit?");L("d_brunna_a1","You look so strong.","Çok güçlü görünüyorsun.","Du siehst so stark aus.");L("d_brunna_a2","Where's the best ore?","En iyi cevher nerede?","Wo liegt das beste Erz?");L("d_brunna_a3","Do the rocks ever talk?","Taşlar hiç konuşur mu?","Sprechen die Steine manchmal?");
L("d_brunna_r1","Flattery! …it works. Thanks. 💗","Pohpohlama! …işe yarıyor. Sağ ol. 💗","Schmeichelei! …klappt. Danke. 💗");L("d_brunna_r2","Up in the Peaks. You need a pickaxe for the crystals. Take this ore.","Zirvelerde. Kristaller için kazma lazım. Bu cevheri al.","Oben in den Gipfeln. Für Kristalle brauchst du eine Spitzhacke. Nimm dieses Erz.");L("d_brunna_r3","They mumble. Mostly 'ouch'. Here, a coin for your good humour.","Mırıldanırlar. Çoğu 'ah'. Espriye bir altın.","Sie murmeln. Meist 'aua'. Hier, eine Münze für den Humor.");
L("d_elio_hi","Ah, a traveler. The runes whispered you'd come.","Ah, bir gezgin. Runeler geleceğini fısıldadı.","Ah, ein Reisender. Die Runen flüsterten, du kämst.");L("d_elio_q","What do the old runes say?","Eski runeler ne diyor?","Was sagen die alten Runen?");L("d_elio_a1","They sound lovely.","Çok güzel duyuluyorlar.","Sie klingen wunderschön.");L("d_elio_a2","Can you read mine?","Benimkini okuyabilir misin?","Kannst du meine lesen?");L("d_elio_a3","'Beware of sheep'?","'Koyunlardan sakın' mı?","'Hüte dich vor Schafen'?");
L("d_elio_r1","Your heart is open, traveler. That is rare. 💗","Kalbin açık gezgin. Bu nadirdir. 💗","Dein Herz ist offen, Reisender. Das ist selten. 💗");L("d_elio_r2","Touch one rune a day at the ruins; they remember the old kings. Take a rune-penny.","Her gün harabede bir runeye dokun; eski krallar hatırlanır. Bir rune parası al.","Berühre täglich eine Rune der Ruinen; sie erinnern die alten Könige. Nimm einen Runenpfennig.");L("d_elio_r3","Ha! Close. It says 'beware of goats'. Take a rune-penny.","Ha! Yakın. 'Keçilerden sakın' yazıyor. Bir rune parası al.","Ha! Fast. Da steht 'Hüte dich vor Ziegen'. Nimm einen Runenpfennig.");
L("d_nettle_hi","Ah, a young one. Mind the nettles, dear, they bite back.","Ah, bir genç. Isırgandan sakın canım, geri ısırır.","Ah, ein junger Mensch. Vorsicht vor Nesseln, Liebes, die beißen zurück.");L("d_nettle_q","What grows in the Thicket?","Çalılıkta ne yetişir?","Was wächst im Dickicht?");L("d_nettle_a1","Your garden is lovely.","Bahçen çok güzel.","Dein Garten ist wunderschön.");L("d_nettle_a2","Any good remedies?","İyi bir ilaç var mı?","Gibt es gute Hausmittel?");L("d_nettle_a3","Does it bite?","Isırır mı?","Beißt es?");
L("d_nettle_r1","Sweet of you to say. The bees agree. 💗","Söylemen ne tatlı. Arılar da aynı fikirde. 💗","Lieb von dir. Die Bienen stimmen zu. 💗");L("d_nettle_r2","Honey Tea calms pets, glow shrooms light the dark. Here, a fresh herb.","Ballı çay hayvanları sakinleştirir, parlak mantarlar karanlığı aydınlatır. Al, taze bir ot.","Honigtee beruhigt Tiere, Leuchtpilze erhellen das Dunkel. Hier, ein frisches Kraut.");L("d_nettle_r3","Only if you bite first, dear. Here, a coin for the grin.","Sen önce ısırırsan, canım. Gülümseme için bir altın.","Nur wenn du zuerst beißt, Liebes. Hier, eine Münze fürs Grinsen.");
