/* ===== text: dialogues ===== */
D('fn1a',`Psst! Hey! You're awake! Finally. I was starting to think you'd sleep another ten years.`,`Pst! Hey! Uyandın! Sonunda. On yıl daha uyuyacaksın sanmıştım.`,`Psst! Hey! Du bist wach! Endlich. Ich dachte schon, du schläfst noch zehn Jahre.`);
D('fn1b',`Don't panic. It's okay. Mostly. It's the year 2050 — the old world ended while you slept in that pod.`,`Panik yok. Her şey yolunda. Neredeyse. Yıl 2050 — sen o kapsülde uyurken eski dünya sona erdi.`,`Keine Panik. Alles gut. Fast. Es ist das Jahr 2050 – die alte Welt ist untergegangen, während du in der Kapsel geschlafen hast.`);
D('fn1c',`The cities went quiet, then green. The people who made it gathered around lanterns — the Lantern Line, villages sharing light and warmth.`,`Şehirler sessizleşti, sonra yeşile büründü. Hayatta kalanlar fenerlerin etrafında toplandı — Fener Hattı, ışığı ve sıcaklığı paylaşan köyler.`,`Die Städte wurden still, dann grün. Wer überlebt hat, sammelte sich um Laternen – die Laternenlinie, Dörfer, die Licht und Wärme teilen.`);
D('fn1d',`But the Line went dark, one beacon at a time. Somebody has to relight them. I picked you. (No pressure!)`,`Ama Hat, fener fener karardı. Birinin onları yeniden yakması lazım. Ben seni seçtim. (Baskı yok!)`,`Aber die Linie ist Leuchtfeuer für Leuchtfeuer erloschen. Jemand muss sie neu entzünden. Ich hab dich ausgesucht. (Kein Druck!)`);
D('fn1e',`Take my old hoe and watering can. Open the chest by the pods, then follow the road north to Lanternrest. I'll tag along!`,`Eski çapamı ve sulama kovamı al. Kapsüllerin yanındaki sandığı aç, sonra kuzeye, Lanternrest'e doğru yürü. Ben de geliyorum!`,`Nimm meine alte Hacke und die Gießkanne. Öffne die Truhe bei den Kapseln und folge dann der Straße nach Norden zur Lanternrest. Ich komme mit!`);
D('fn_hint','Psst, need a nudge?','Pst, küçük bir ipucu ister misin?','Psst, brauchst du einen Tipp?');
D('fn_i1','The air smells like rain and old books today.','Bugün hava yağmur ve eski kitap kokuyor.','Heute riecht die Luft nach Regen und alten Büchern.');D('fn_i2','Foxes see the Line from far away. Tiny golden dots.','Tilkiler Hat\'ı uzaktan görür. Minik altın noktalar.','Füchse sehen die Linie schon von Weitem. Winzige goldene Punkte.');D('fn_i3','Sleep in a bed and the crops grow while you dream. Magic!','Yatakta uyursan ekinler sen rüya görürken büyür. Sihir!','Schlaf im Bett und die Pflanzen wachsen, während du träumst. Magie!');D('fn_i4','Want to see something cool? Climb a tower. Seriously.','Havalı bir şey görmek ister misin? Bir kuleye çık. Cidden.','Willst du was Cooles sehen? Klettere auf einen Turm. Echt.');
D('tl1a',`Well, look at that — a sleeper from the Cradle! Welcome to Lanternrest. I'm Tilda. I keep this town running.`,`Vay, bak sen — Beşik'ten bir uyuyan! Lanternrest'e hoş geldin. Ben Tilda. Bu kasabayı ben idare ederim.`,`Na so was – ein Schläfer aus der Wiege! Willkommen in Lanternrest. Ich bin Tilda und halte die Stadt am Laufen.`);
D('tl1b',`Fenn told you about the Line? Good. Our beacon on the green is the oldest one — it hasn't burned in nine years.`,`Fenn sana Hat'tan bahsetti mi? İyi. Meydandaki fenerimiz en eskisi — dokuz yıldır yanmadı.`,`Fenn hat dir von der Linie erzählt? Gut. Unser Leuchtfeuer auf dem Anger ist das älteste – es brennt seit neun Jahren nicht mehr.`);
D('tl1c',`Start small. Chop three trees by the road with your axe and come back. Everyone here chops wood, don't give me that look.`,`Küçük başla. Yolun kenarındaki üç ağacı baltayla kes, sonra gel. Burada herkes odun keser, öyle bakma.`,`Fang klein an. Fäll drei Bäume an der Straße mit deiner Axt und komm zurück. Hier hackt jeder Holz, schau nicht so.`);
D('tl_wait','Three trees. Axe. Road. You can do this!','Üç ağaç. Balta. Yol. Yaparsın!','Drei Bäume. Axt. Straße. Du schaffst das!');
D('tl2a',`Three logs, nice and straight! You've got good hands. Take my carpentry blueprint — with planks you can build real houses.`,`Üç kütük, dümdüz! Elin iyi iş tutuyor. Marangozluk planımı al — kalaslarla gerçek evler yapabilirsin.`,`Drei Stämme, schön gerade! Du hast geschickte Hände. Nimm meinen Zimmermanns-Bauplan – mit Brettern baust du richtige Häuser.`);
D('tl2b',`And here's some wood to get you started. Come by my desk in the Village tab — I'll show you how the Town Hall works.`,`Başlaman için biraz odun da al. Köy sekmesindeki masama uğra — Belediye'nin nasıl çalıştığını göstereyim.`,`Und etwas Holz für den Anfang. Komm zu meinem Schreibtisch im Dorf-Tab – ich zeige dir, wie das Rathaus funktioniert.`);
D('tl2c',`Taxes, folks, moods… it's less boring than it sounds. Go on!`,`Vergiler, insanlar, ruh halleri… Kulağa geldiğinden daha az sıkıcı. Hadi!`,`Steuern, Leute, Stimmungen … klingt langweiliger, als es ist. Los!`);
D('tl3a',`You built a house! Wonderful. A roof over their heads makes villagers happier — and they'll move right in.`,`Bir ev yaptın! Harika. Başlarının üstünde çatı olması köylüleri mutlu eder — hemen taşınacaklar.`,`Du hast ein Haus gebaut! Wunderbar. Ein Dach über dem Kopf macht die Leute glücklicher – und sie ziehen gleich ein.`);
D('tl3b',`Here, a little something. Decorate your own home too — it's the little hut next to the green.`,`Al, küçük bir hediye. Kendi evini de süsle — meydanın yanındaki küçük kulübe.`,`Hier, eine Kleinigkeit. Richte auch dein eigenes Zuhause ein – die kleine Hütte neben dem Anger.`);
D('tl_light','The beacon needs wood, stone and fibre. Light it and the Line wakes up!','Fenerin odun, taş ve lif istiyor. Yak, Hat uyansın!','Das Leuchtfeuer braucht Holz, Stein und Fasern. Zünde es an und die Linie erwacht!');
D('pp1a',`Pip's Wares! Best prices on the whole Line! Okay… the only prices. But still!`,`Pip'in Malları! Bütün Hat'ta en iyi fiyatlar! Tamam… tek fiyatlar. Ama yine de!`,`Pips Waren! Beste Preise der ganzen Linie! Na gut … die einzigen Preise. Aber trotzdem!`);
D('pp1b',`You look hungry. Here, my grandma's recipe — the cooking blueprint. Stew, tea, pie! Any stove will do.`,`Aç görünüyorsun. Al, büyükannemin tarifi — yemek planı. Güveç, çay, turta! Her ocak olur.`,`Du siehst hungrig aus. Hier, das Rezept meiner Oma – der Koch-Bauplan. Eintopf, Tee, Kuchen! Jeder Herd geht.`);
D('pp1c',`Visit any time to buy, sell or chat. Business is cozy!`,`İstediğin zaman uğra: al, sat, sohbet et. İşler cozy!`,`Komm jederzeit zum Kaufen, Verkaufen oder Plaudern. Das Geschäft ist gemütlich!`);
D('ne1a',`Fresh face! I'm Nettle. Mind the mud, it's the good kind.`,`Yeni bir yüz! Ben Nettle. Çamura dikkat, iyi cinsten.`,`Ein frisches Gesicht! Ich bin Nettle. Vorsicht, Matsch – der gute Sorte.`);
D('ne1b',`Mossgate was a farming town. The soil's still great, but our pumps died years ago. I'm drowning in mud and starving for turnips.`,`Mossgate bir çiftçi kasabasıydı. Toprak hâlâ harika ama pompalarımız yıllar önce bozuldu. Çamurda boğuluyorum ve şalgama hasretim.`,`Mossgate war eine Bauernstadt. Der Boden ist toll, aber die Pumpen sind längst kaputt. Ich versinke im Matsch und lechze nach Rüben.`);
D('ne1c',`Bring me four real turnips — till, plant, water, wait. I'll teach you what the old farmers knew.`,`Bana dört gerçek şalgam getir — çapala, ek, sula, bekle. Eski çiftçilerin bildiğini öğreteyim.`,`Bring mir vier echte Rüben – hacken, säen, gießen, warten. Dann zeige ich dir, was die alten Bauern wussten.`);
D('ne_wait','Four turnips, friend. Sleeping in a bed makes the days pass faster!','Dört şalgam dostum. Yatakta uyumak günleri hızlandırır!','Vier Rüben, Freund. Im Bett schlafen lässt die Tage schneller vergehen!');
D('ne2a',`Look at those! Crunchy. You've got the touch.`,`Şunlara bak! Çıtır çıtır. Elinde bereket var.`,`Schau dir die an! Knackig. Du hast das Händchen.`);
D('ne2b',`Take my notes: irrigation — sprinklers that water plots on their own — and compost for faster growth.`,`Notlarımı al: sulama — kendi kendine sulayan fıskiyeler — ve daha hızlı büyüme için kompost.`,`Nimm meine Notizen: Bewässerung – Sprinkler, die von allein gießen – und Kompost für schnelleres Wachstum.`);
D('ne2c',`Our beacon wants planks, fibre and herbs. Craft planks at the workbench in Lanternrest.`,`Fenerimiz kalas, lif ve ot istiyor. Kalasları Lanternrest'teki tezgâhta yap.`,`Unser Leuchtfeuer will Bretter, Fasern und Kräuter. Bretter baust du an der Werkbank in Lanternrest.`);
D('ne_light','The beacon wants planks, fibre and herbs. Then watch Mossgate glow.','Fener kalas, lif ve ot istiyor. Sonra Mossgate\'in parıldamasını izle.','Das Leuchtfeuer will Bretter, Fasern und Kräuter. Dann leuchtet Mossgate.');
D('od1a',`Careful on the boards, sunshine, they're slippery. I'm Odo. Driftwater used to be a highway. Now it's a lake with opinions.`,`Tahtalara dikkat, güneşim, kaygan. Ben Odo. Driftwater eskiden otoyoldu. Şimdi fikirleri olan bir göl.`,`Vorsicht auf den Brettern, Sonnenschein, die sind glatt. Ich bin Odo. Driftwater war mal eine Autobahn. Jetzt ist es ein See mit Meinung.`);
D('od1b',`I know how to build boats and stilt houses. Just short on planks and reeds. Bring me three planks and four reeds from the shore.`,`Tekne ve kazıklı ev yapmayı bilirim. Sadece kalas ve kamış az. Bana üç kalas ve kıyıdan dört kamış getir.`,`Ich kann Boote und Stelzenhäuser bauen. Mir fehlen nur Bretter und Schilf. Bring mir drei Bretter und vier Schilfrohre vom Ufer.`);
D('od1c',`Planks come from the workbench in Lanternrest. Reeds grow on the water's edge.`,`Kalaslar Lanternrest'teki tezgâhtan. Kamışlar su kıyısında yetişir.`,`Bretter gibt es an der Werkbank in Lanternrest. Schilf wächst am Ufer.`);
D('od_wait','Three planks and four reeds. The shore is full of them.','Üç kalas, dört kamış. Kıyı bunlarla dolu.','Drei Bretter, vier Schilfrohre. Das Ufer ist voll davon.');
D('od2a',`Solid planks! Fine reeds! You're alright, sunshine.`,`Sağlam kalaslar! Güzel kamışlar! Sen iyisin güneşim.`,`Feste Bretter! Feines Schilf! Du bist in Ordnung, Sonnenschein.`);
D('od2b',`Here are my blueprints — boats, and stilt houses for dry feet in flood country.`,`İşte planlarım — tekneler ve sel bölgesinde kuru ayaklar için kazıklı evler.`,`Hier meine Baupläne – Boote und Stelzenhäuser für trockene Füße im Flutland.`);
D('od2c',`Our beacon needs six planks, six reeds and three fish. Fish are good for the soul, too.`,`Fenerimiz altı kalas, altı kamış ve üç balık istiyor. Balık ruha da iyi gelir.`,`Unser Leuchtfeuer braucht sechs Bretter, sechs Schilfrohre und drei Fische. Fisch tut auch der Seele gut.`);
D('od_light','Six planks, six reeds, three fish. Then Driftwater sparkles again.','Altı kalas, altı kamış, üç balık. Sonra Driftwater yine parlar.','Sechs Bretter, sechs Schilfrohre, drei Fische. Dann funkelt Driftwater wieder.');
D('sa1a',`Welcome to Dunehaven, traveller. The sun here is… enthusiastic.`,`Dunehaven'a hoş geldin yolcu. Buradaki güneş… hevesli.`,`Willkommen in Dunehaven, Reisender. Die Sonne hier ist … begeistert.`);
D('sa1b',`Sandstorms ate our solar panels. I can teach you how they work — bring me two crystals and a bit of scrap.`,`Kum fırtınaları güneş panellerimizi yedi. Nasıl çalıştıklarını öğretebilirim — iki kristal ve biraz hurda getir.`,`Sandstürme haben unsere Solarpaneele gefressen. Ich kann dir zeigen, wie sie funktionieren – bring mir zwei Kristalle und etwas Schrott.`);
D('sa1c',`Crystals glitter in caves and rocky ground. Scrap hides in old junk. You'll need a flask to survive the desert heat, too.`,`Kristaller mağaralarda ve kayalık yerlerde parlar. Hurda eski eşyaların arasında saklanır. Çöl sıcağında hayatta kalmak için bir mataraya da ihtiyacın var.`,`Kristalle glitzern in Höhlen und felsigem Grund. Schrott versteckt sich in altem Kram. Und eine Flasche brauchst du für die Wüstenhitze.`);
D('sa_wait','Two crystals and a little scrap. Dig around the rocks.','İki kristal ve biraz hurda. Kayaların arasını kaz.','Zwei Kristalle und etwas Schrott. Such zwischen den Felsen.');
D('sa2a',`Beautiful! Look how they catch the light.`,`Muhteşem! Işığı nasıl yakaladıklarına bak.`,`Wunderschön! Schau, wie sie das Licht einfangen.`);
D('sa2b',`Here: the solar blueprint. Lamps, solar cells, and a bigger Town Hall.`,`Al: güneş planı. Lambalar, güneş hücreleri ve daha büyük bir Belediye.`,`Hier: der Solar-Bauplan. Lampen, Solarzellen und ein größeres Rathaus.`);
D('sa2c',`Our beacon needs glass, cactus fruit and planks. Smelt glass at the workbench from sand.`,`Fenerimiz cam, kaktüs meyvesi ve kalas istiyor. Camı tezgâhta kumdan eritirsin.`,`Unser Leuchtfeuer braucht Glas, Kaktusfrüchte und Bretter. Glas schmilzt du an der Werkbank aus Sand.`);
D('sa_light','Glass, cactus fruit, planks. Then Dunehaven glows like honey.','Cam, kaktüs meyvesi, kalas. Sonra Dunehaven bal gibi parlar.','Glas, Kaktusfrüchte, Bretter. Dann leuchtet Dunehaven wie Honig.');
D('br1a',`Hmph. Another wanderer. I'm Brunna. This is Ironhold. I forge.`,`Hmph. Bir gezgin daha. Ben Brunna. Burası Ironhold. Ben demirciyim.`,`Hmpf. Noch ein Wanderer. Ich bin Brunna. Das ist Ironhold. Ich schmiede.`);
D('br1b',`I know the old forging methods. Six ore and four scrap, and I'll teach you. Not a bolt less.`,`Eski dövme yöntemlerini bilirim. Altı cevher, dört hurda, sana öğretirim. Bir cıvata eksik olmaz.`,`Ich kenne die alten Schmiedetechniken. Sechs Erz und vier Schrott, dann zeige ich sie dir. Keine Schraube weniger.`);
D('br1c',`Ore comes from the rocky hills. Scrap — from the dead cars and rubble out east.`,`Cevher kayalık tepelerden gelir. Hurda — doğudaki ölü arabalardan ve molozlardan.`,`Erz kommt aus den felsigen Hügeln. Schrott – von den toten Autos und dem Schutt im Osten.`);
D('br_wait','Six ore, four scrap. Don\'t make me repeat myself.','Altı cevher, dört hurda. Beni tekrar ettirme.','Sechs Erz, vier Schrott. Lass mich nicht wiederholen.');
D('br2a',`…Not bad. Solid stuff. Fine, you've earned it.`,`…Fena değil. Sağlam malzeme. Peki, hak ettin.`,`… Nicht schlecht. Gutes Zeug. Gut, du hast es verdient.`);
D('br2b',`Forging blueprint: swords, circuits, barracks. Careful with it.`,`Dövme planı: kılıçlar, devreler, kışla. Dikkatli kullan.`,`Schmiede-Bauplan: Schwerter, Schaltkreise, Kaserne. Geh vorsichtig damit um.`);
D('br2c',`Ironhold will light its own lantern. Now go. I have a hammer to hit.`,`Ironhold kendi fenerini yakacak. Şimdi git. Vuracak çekicim var.`,`Ironhold zündet seine Laterne selbst an. Jetzt geh. Ich muss auf etwas einhämmern.`);
D('el1a',`Oh! A visitor! Shh — don't breathe on the lens.`,`Oh! Bir ziyaretçi! Şşş — merceğe nefes verme.`,`Oh! Ein Besucher! Pst – nicht auf die Linse atmen.`);
D('el1b',`I've been tracking the Lantern Line from up here. Seven lights, once. If you're heading north, you'll need a proper coat.`,`Buradan Fener Hattı'nı izliyorum. Bir zamanlar yedi ışık. Kuzeye gidiyorsan düzgün bir paltoya ihtiyacın var.`,`Von hier oben beobachte ich die Laternenlinie. Einst sieben Lichter. Wenn du nach Norden willst, brauchst du einen ordentlichen Mantel.`);
D('el1c',`Bring me two glass panes for the telescope and I'll give you the pattern.`,`Teleskop için iki cam levha getir, sana deseni vereyim.`,`Bring mir zwei Glasscheiben fürs Teleskop und ich gebe dir das Schnittmuster.`);
D('el_wait','Two glass panes. Sand and fire, my friend.','İki cam levha. Kum ve ateş dostum.','Zwei Glasscheiben. Sand und Feuer, mein Freund.');
D('el2a',`Perfect! Now I can see the stars again.`,`Mükemmel! Artık yıldızları yine görebiliyorum.`,`Perfekt! Jetzt sehe ich die Sterne wieder.`);
D('el2b',`Here's the coat blueprint, plus some cloth. Craft the coat at the workbench and the snow is yours.`,`İşte palto planı ve biraz kumaş. Paltoyu tezgâhta yap, kar senin olsun.`,`Hier der Mantel-Bauplan und etwas Stoff. Bau den Mantel an der Werkbank und der Schnee gehört dir.`);
D('el2c',`The frozen north is beautiful. And very, very cold.`,`Donmuş kuzey çok güzel. Ve çok ama çok soğuk.`,`Der gefrorene Norden ist wunderschön. Und sehr, sehr kalt.`);
D('bj1a',`Cold enough for you? Good. I'm Bjorn. Glimmerfrost survives on wool and stubbornness.`,`Yeterince soğuk mu? İyi. Ben Bjorn. Glimmerfrost yün ve inatla ayakta kalır.`,`Kalt genug? Gut. Ich bin Bjorn. Glimmerfrost überlebt mit Wolle und Sturheit.`);
D('bj1b',`I'll teach you insulation and how to keep a greenhouse warm. Bring me four cloth — spin it from fibre at the workbench.`,`Sana yalıtımı ve serayı sıcak tutmayı öğretirim. Dört kumaş getir — tezgâhta liften eğir.`,`Ich zeige dir Dämmung und wie man ein Gewächshaus warm hält. Bring mir vier Stoffe – spinne sie an der Werkbank aus Fasern.`);
D('bj1c',`You'll need the coat to be here at all. Good — you have one.`,`Burada olmak için bile palto lazım. İyi — sende var.`,`Ohne Mantel hältst du es hier gar nicht aus. Gut – du hast einen.`);
D('bj_wait','Four cloth. Fibre, wheel, patience.','Dört kumaş. Lif, çıkrık, sabır.','Vier Stoffe. Fasern, Spinnrad, Geduld.');
D('bj2a',`Soft and tight. You've got the knack.`,`Yumuşak ve sıkı. Bu işte ustasın.`,`Weich und dicht. Du hast den Dreh raus.`);
D('bj2b',`My notes: insulation keeps villagers warm all winter, and greenhouses ignore the seasons near a lit beacon.`,`Notlarım: yalıtım köylüleri bütün kış sıcak tutar, seralar yanan bir fenerin yakınında mevsimleri takmaz.`,`Meine Notizen: Dämmung hält die Leute den ganzen Winter warm, und Gewächshäuser ignorieren in der Nähe eines Leuchtfeuers die Jahreszeiten.`);
D('bj2c',`Our beacon wants cloth, crystals and glass. Light it. We've been in the dark long enough.`,`Fenerimiz kumaş, kristal ve cam istiyor. Yak onu. Yeterince karanlıkta kaldık.`,`Unser Leuchtfeuer will Stoff, Kristalle und Glas. Zünde es an. Wir saßen lange genug im Dunkeln.`);
D('bj_light','Cloth, crystals, glass. Light it and Glimmerfrost sings.','Kumaş, kristal, cam. Yak, Glimmerfrost şarkı söylesin.','Stoff, Kristalle, Glas. Zünde es an und Glimmerfrost singt.');
D('ru1a',`Don't touch the scrap. Okay, touch the scrap. I'm Rue.`,`Hurdaya dokunma. Tamam, dokun. Ben Rue.`,`Fass den Schrott nicht an. Okay, fass ihn an. Ich bin Rue.`);
D('ru1b',`Our relay died years ago. I can fix it with three circuits. Craft them from scrap and ore — you'll need Brunna's forge blueprint.`,`Rölemiz yıllar önce öldü. Üç devreyle tamir edebilirim. Onları hurda ve cevherden yap — Brunna'nın dövme planı lazım.`,`Unser Relais ist vor Jahren gestorben. Mit drei Schaltkreisen kann ich es reparieren. Baue sie aus Schrott und Erz – du brauchst Brunnas Schmiede-Bauplan.`);
D('ru1c',`Wastelands are rough. Bring a filter mask or you'll cough up lungs.`,`Çorak topraklar zor. Filtreli maske getir yoksa ciğerlerini öksürürsün.`,`Das Ödland ist hart. Nimm eine Filtermaske mit, sonst hustest du dir die Lunge raus.`);
D('ru_wait','Three circuits. Scrap and ore. Make them at the workbench.','Üç devre. Hurda ve cevher. Tezgâhta yap.','Drei Schaltkreise. Schrott und Erz. An der Werkbank bauen.');
D('ru2a',`Hah! They're beautiful. Look at them blink.`,`Hah! Çok güzeller. Yanıp sönmelerine bak.`,`Hah! Wunderschön. Schau, wie sie blinken.`);
D('ru2b',`Relay's back. Here, spare solar cells and scrap — for the beacon.`,`Röle geri geldi. Al, yedek güneş hücreleri ve hurda — fener için.`,`Das Relais läuft wieder. Hier, Ersatz-Solarzellen und Schrott – für das Leuchtfeuer.`);
D('ru2c',`Oh, and learn Radio if you can. A lit beacon plus radio means fast travel. Trust me.`,`Ha, mümkünse Telsiz'i öğren. Yanan fener artı telsiz, hızlı yolculuk demek. Güven bana.`,`Ach ja, lerne Funk, wenn du kannst. Leuchtfeuer plus Funk heißt Schnellreise. Vertrau mir.`);
D('ru_light','Circuits, scrap, solar cells. Light the beacon!','Devre, hurda, güneş hücresi. Feneri yak!','Schaltkreise, Schrott, Solarzellen. Zünde das Leuchtfeuer an!');
D('bo1a',`GREETINGS. I AM BOLT. I HAVE KEPT THE GREAT LANTERN READY FOR 2,191 DAYS.`,`SELAMLAR. BEN BOLT. BÜYÜK FENERİ 2.191 GÜNDÜR HAZIR TUTUYORUM.`,`GRÜSSE. ICH BIN BOLT. ICH HALTE DIE GROSSE LATERNE SEIT 2.191 TAGEN BEREIT.`);
D('bo1b',`I WAS TOLD SOMEONE WOULD COME. YOU ARE SMALLER THAN EXPECTED. THIS IS A COMPLIMENT.`,`BİRİNİN GELECEĞİ SÖYLENMİŞTİ. BEKLENENDEN KÜÇÜKSÜN. BU BİR İLTİFATTIR.`,`MAN SAGTE MIR, JEMAND WERDE KOMMEN. DU BIST KLEINER ALS ERWARTET. DAS IST EIN KOMPLIMENT.`);
D('bo1c',`THE GREAT LANTERN IGNITES ONLY WHEN THE SIX OTHER BEACONS BURN. THE LINE MUST BE WHOLE.`,`BÜYÜK FENER ANCAK ALTI FENER YANARKEN TUTUŞUR. HAT BÜTÜN OLMALI.`,`DIE GROSSE LATERNE ZÜNDET NUR, WENN DIE SECHS ANDEREN LEUCHTFEUER BRENNEN. DIE LINIE MUSS GANZ SEIN.`);
D('bo1d',`IT ALSO NEEDS CIRCUITS, SOLAR CELLS, CRYSTALS AND GLASS. I HAVE NONE. I AM SORRY. I AM A ROBOT WITH NOTHING.`,`AYRICA DEVRE, GÜNEŞ HÜCRESİ, KRİSTAL VE CAM GEREKİR. BENDE HİÇBİRİ YOK. ÜZGÜNÜM. HİÇBİR ŞEYİ OLMAYAN BİR ROBOTUM.`,`SIE BRAUCHT AUSSERDEM SCHALTKREISE, SOLARZELLEN, KRISTALLE UND GLAS. ICH HABE NICHTS DAVON. ES TUT MIR LEID. ICH BIN EIN ROBOTER OHNE ALLES.`);
D('bo_wait','THE LINE IS NOT WHOLE YET. I WILL WAIT. I AM GOOD AT WAITING.','HAT HENÜZ BÜTÜN DEĞİL. BEKLERİM. BEKLEMEKTE İYİYİM.','DIE LINIE IST NOCH NICHT GANZ. ICH WARTE. ICH BIN GUT DARIN.');
D('bo_ready','SIX LIGHTS DETECTED. IMPRESSIVE. THE GREAT LANTERN AWAITS YOUR HAND.','ALTI IŞIK ALGILANDI. ETKİLEYİCİ. BÜYÜK FENER ELİNİ BEKLİYOR.','SECHS LICHTER ERKANNT. BEEINDRUCKEND. DIE GROSSE LATERNE ERWARTET DEINE HAND.');
D('nt_what','What would you like to do?','Ne yapmak istersin?','Was möchtest du tun?');D('nt_hall','Town Hall','Belediye','Rathaus');D('nt_shop','Shop','Dükkân','Laden');D('nt_chat','Chat','Sohbet','Plaudern');
/* idle lines */
const IDLE={tilda:[[`Roof, road, and a bowl of soup. That's all a town really needs.`,`Çatı, yol ve bir kase çorba. Bir kasabaya bundan fazlası lazım değil.`,`Dach, Straße und eine Schüssel Suppe. Mehr braucht eine Stadt nicht.`],[`The Hall's door is always open. Taxes, however, are not optional.`,`Belediye'nin kapısı hep açık. Ama vergi isteğe bağlı değil.`,`Die Tür des Rathauses ist immer offen. Steuern sind aber nicht optional.`],[`Every beacon you light, I sleep a little better.`,`Yaktığın her fenerle biraz daha iyi uyuyorum.`,`Mit jedem Leuchtfeuer, das du entzündest, schlafe ich besser.`]],
 pip:[[`Rumour: someone saw glowing mushrooms in the swamp. Might be true!`,`Dedikodu: biri bataklıkta parlayan mantarlar görmüş. Doğru olabilir!`,`Gerücht: Jemand hat leuchtende Pilze im Sumpf gesehen. Könnte stimmen!`],[`Everything's for sale, except my hat.`,`Her şey satılık, şapkam hariç.`,`Alles ist zu verkaufen, außer meinem Hut.`],[`Tea! Hot! Cheap! (It's not cheap.)`,`Çay! Sıcak! Ucuz! (Ucuz değil.)`,`Tee! Heiß! Billig! (Ist nicht billig.)`]],
 nettle:[[`Rain's coming. The beans can feel it.`,`Yağmur geliyor. Fasulyeler hissediyor.`,`Es regnet bald. Die Bohnen spüren es.`],[`Water early, harvest happy.`,`Erken sula, mutlu hasat et.`,`Früh gießen, glücklich ernten.`],[`Seeds hide in old ruins. Keep your eyes open!`,`Tohumlar eski harabelerde saklanır. Gözlerini aç!`,`Samen verstecken sich in alten Ruinen. Halt die Augen offen!`]],
 odo:[[`Fish bite best at dawn. Or whenever. Fish are unpredictable.`,`Balıklar en çok şafakta ısırır. Ya da ne zaman olursa. Balıklar tahmin edilemez.`,`Fische beißen am besten im Morgengrauen. Oder wann anders. Fische sind unberechenbar.`],[`The highway still hums on quiet nights. Listen.`,`Otoyol hâlâ sessiz gecelerde uğuldar. Dinle.`,`Die Autobahn summt in stillen Nächten noch. Hör zu.`],[`Boats are just houses that decided to leave.`,`Tekneler gitmeye karar vermiş evlerdir.`,`Boote sind nur Häuser, die beschlossen haben abzuhauen.`]],
 sahra:[[`Drink water. More than you think you need.`,`Su iç. Sandığından fazla.`,`Trink Wasser. Mehr, als du denkst.`],[`The pyramid east of here is older than the old world. Be careful.`,`Buranın doğusundaki piramit eski dünyadan eski. Dikkatli ol.`,`Die Pyramide östlich von hier ist älter als die alte Welt. Sei vorsichtig.`],[`At night the desert is the best place for stars.`,`Geceleri çöl, yıldızlar için en iyi yerdir.`,`Nachts ist die Wüste der beste Platz für Sterne.`]],
 brunna:[[`Hmph.`,`Hmph.`,`Hmpf.`],[`Good steel is patience with a hammer.`,`İyi çelik, çekiçli sabırdır.`,`Guter Stahl ist Geduld mit einem Hammer.`],[`Don't lean on the anvil.`,`Örse yaslanma.`,`Lehn dich nicht an den Amboss.`]],
 elio:[[`The sky is clearer than ever. Silver lining of the apocalypse.`,`Gökyüzü hiç olmadığı kadar berrak. Kıyametin gümüş astarı.`,`Der Himmel ist klarer denn je. Der Silberstreif der Apokalypse.`],[`I count 41 new stars. Unofficial.`,`41 yeni yıldız sayıyorum. Resmi değil.`,`Ich zähle 41 neue Sterne. Inoffiziell.`],[`Shh. The lens is thinking.`,`Şşş. Mercek düşünüyor.`,`Pst. Die Linse denkt nach.`]],
 bjorn:[[`Wool, wool, wool. Wool solves everything.`,`Yün, yün, yün. Yün her şeyi çözer.`,`Wolle, Wolle, Wolle. Wolle löst alles.`],[`The aurora is out. Look up.`,`Aurora çıktı. Yukarı bak.`,`Das Polarlicht ist da. Schau nach oben.`],[`The ice cave holds old secrets. And ice.`,`Buz mağarası eski sırlar saklar. Bir de buz.`,`Die Eishöhle birgt alte Geheimnisse. Und Eis.`]],
 rue:[[`Every gadget is just a puzzle that wants to be solved.`,`Her aygıt çözülmek isteyen bir bulmacadır.`,`Jedes Gerät ist ein Rätsel, das gelöst werden will.`],[`The reactor glows at night. Don't go in without a filter.`,`Reaktör geceleri parlar. Filtre olmadan girme.`,`Der Reaktor glüht nachts. Geh nicht ohne Filter hinein.`],[`Scrap is just treasure that hasn't met me yet.`,`Hurda, benimle tanışmamış hazinedir.`,`Schrott ist nur ein Schatz, der mich noch nicht getroffen hat.`]],
 bolt:[[`I HAVE POLISHED THE LANTERN 4,382 TIMES. IT REMAINS SHINY.`,`FENERİ 4.382 KEZ PARLATTIM. HÂLÂ PARLAK.`,`ICH HABE DIE LATERNE 4.382 MAL POLIERT. SIE GLÄNZT NOCH.`],[`THE FLOWERS ARE GROWING THROUGH THE ROAD. I HAVE DECIDED THIS IS ACCEPTABLE.`,`ÇİÇEKLER YOLDAN BİTİYOR. BUNUN KABUL EDİLEBİLİR OLDUĞUNA KARAR VERDİM.`,`DIE BLUMEN WACHSEN DURCH DIE STRASSE. ICH HABE BESCHLOSSEN, DAS IST AKZEPTABEL.`],[`THANK YOU FOR COMING.`,`GELDİĞİN İÇİN TEŞEKKÜRLER.`,`DANKE, DASS DU GEKOMMEN BIST.`]],
 mira:[[`Have you seen the pods? There are three. Spooky.`,`Kapsülleri gördün mü? Üç tane var. Ürkütücü.`,`Hast du die Kapseln gesehen? Es gibt drei. Gruselig.`],[`I want to see the sea someday!`,`Bir gün denizi görmek istiyorum!`,`Ich will eines Tages das Meer sehen!`]],marlo:[[`Quiet lake, quiet mind.`,`Sakin göl, sakin zihin.`,`Stiller See, stiller Geist.`],[`Big ones live in the deep water.`,`Büyükler derin suda yaşar.`,`Die Großen leben im tiefen Wasser.`]],wren:[[`The Line is brighter from the road, if you know where to look.`,`Hat yoldan daha parlak görünür, nereye bakacağını biliyorsan.`,`Die Linie leuchtet von der Straße heller, wenn man weiß, wohin man schauen muss.`],[`I wander so my feet remember.`,`Ayaklarım hatırlasın diye gezerim.`,`Ich wandere, damit meine Füße sich erinnern.`]],
 moss1:[[`Mushrooms in the dark corners. Mind the spores!`,`Karanlık köşelerde mantarlar. Sporlara dikkat!`,`Pilze in dunklen Ecken. Achtung, Sporen!`],[`Nettle says I talk too much. Nettle talks more.`,`Nettle çok konuştuğumu söylüyor. Nettle daha çok konuşuyor.`,`Nettle sagt, ich rede zu viel. Nettle redet mehr.`]],dw1:[[`The water is clearer here than before. Weird, right?`,`Su burada eskisinden daha berrak. Garip değil mi?`,`Das Wasser ist hier klarer als früher. Komisch, oder?`],[`I counted nine different frogs today.`,`Bugün dokuz farklı kurbağa saydım.`,`Ich habe heute neun verschiedene Frösche gezählt.`]],dh1:[[`Cactus fruit is the best thing in the desert. Don't tell the camels.`,`Kaktüs meyvesi çölün en iyi şeyi. Develere söyleme.`,`Kaktusfrüchte sind das Beste in der Wüste. Sag's nicht den Kamelen.`],[`There's an oasis east of here. It's real, I swear.`,`Buranın doğusunda bir vaha var. Gerçek, yemin ederim.`,`Östlich von hier gibt es eine Oase. Echt, ich schwöre.`]],gf1:[[`Hot soup, warm socks. The two pillars of civilisation.`,`Sıcak çorba, sıcak çorap. Medeniyetin iki sütunu.`,`Heiße Suppe, warme Socken. Die zwei Säulen der Zivilisation.`],[`The frozen lake sings at night. Seriously.`,`Donmuş göl geceleri şarkı söyler. Cidden.`,`Der gefrorene See singt nachts. Wirklich.`]],rw1:[[`Rue says I'm her apprentice. I say I'm her friend.`,`Rue çırağı olduğumu söylüyor. Ben arkadaşı olduğumu söylüyorum.`,`Rue sagt, ich bin ihre Lehrling. Ich sage, ich bin ihre Freundin.`],[`Sparks are pretty. Sparks are also dangerous.`,`Kıvılcımlar güzeldir. Kıvılcımlar tehlikelidir de.`,`Funken sind schön. Funken sind auch gefährlich.`]]};
Object.keys(IDLE).forEach(id=>IDLE[id].forEach((v,i)=>D('nt_'+id+'_'+(i+1),v[0],v[1],v[2])));
D('nt_act_1','Welcome to the Line! It will feel like home soon.','Hat\'a hoş geldin! Yakında evin gibi hissedeceksin.','Willkommen an der Linie! Bald fühlt es sich wie Zuhause an.');D('nt_act_2','Lanternrest, Mossgate, Driftwater… the lights are coming back.','Lanternrest, Mossgate, Driftwater… ışıklar geri geliyor.','Lanternrest, Mossgate, Driftwater … die Lichter kehren zurück.');D('nt_act_3','They say you can see Dunehaven\'s beacon from the desert dunes.','Dunehaven\'ın fenerini çöl kumullarından görebilirsin derler.','Man sagt, Dunehavens Leuchtfeuer sieht man von den Dünen aus.');D('nt_act_4','The north is cold, but the people are warm.','Kuzey soğuk ama insanlar sıcak.','Der Norden ist kalt, aber die Menschen sind warm.');D('nt_act_5','Only one beacon left. The big one.','Sadece bir fener kaldı. Büyük olan.','Nur noch ein Leuchtfeuer. Das große.');
/* side-quest text: [ask, remind, thanks] each [en,tr,de] */
const SQT={
 mira:[[`Psst! I found a berry bush but I'm scared of the bugs. Can you pick me three berries?`,`Pst! Bir böğürtlen çalısı buldum ama böceklerden korkuyorum. Bana üç meyve toplar mısın?`,`Psst! Ich habe einen Beerenstrauch gefunden, aber ich habe Angst vor den Käfern. Pflückst du mir drei Beeren?`],[`Three berries, from the bushes!`,`Üç meyve, çalılardan!`,`Drei Beeren, von den Sträuchern!`],[`Yay! Take these strawberry seeds. I found them in a lunch box!`,`Yaşasın! Bu çilek tohumlarını al. Bir beslenme çantasında buldum!`,`Juhu! Nimm diese Erdbeersamen. Ich hab sie in einer Brotdose gefunden!`]],
 marlo:[[`Lost my best rod in the lake. Bring me three fish and I'll give you a spare.`,`En iyi oltamı gölde kaybettim. Üç balık getir, yedek bir tane vereyim.`,`Ich habe meine beste Angel im See verloren. Bring mir drei Fische und du bekommst eine Ersatzangel.`],[`Three fish and the spare rod is yours.`,`Üç balık, yedek olta senin.`,`Drei Fische und die Ersatzangel gehört dir.`],[`Beauties! Here: a rod. Don't lose it like I did.`,`Güzeller! Al: bir olta. Benim gibi kaybetme.`,`Prachtstücke! Hier: eine Angel. Verlier sie nicht wie ich.`]],
 wren:[[`I lost my way twice today. Bring me four herbs for my tea and I'll give you my compass.`,`Bugün iki kez yolumu kaybettim. Çayım için dört ot getir, sana pusulamı vereyim.`,`Ich habe mich heute zweimal verlaufen. Bring mir vier Kräuter für meinen Tee und du bekommst meinen Kompass.`],[`Four herbs from the meadow, please.`,`Çayırdan dört ot lütfen.`,`Vier Kräuter von der Wiese, bitte.`],[`Mmm, lovely. The compass shows you more of the world.`,`Mmm, harika. Pusula sana dünyadan daha fazlasını gösterir.`,`Mmm, herrlich. Der Kompass zeigt dir mehr von der Welt.`]],
 moss1:[[`I'm Hazel. Could you find three mushrooms for my compost heap? Mushrooms make it sing.`,`Ben Hazel. Kompost yığınım için üç mantar bulabilir misin? Mantarlar onu şarkı söyletir.`,`Ich bin Hazel. Findest du drei Pilze für meinen Komposthaufen? Pilze bringen ihn zum Singen.`],[`Mushrooms hide in shady spots.`,`Mantarlar gölgelik yerlerde saklanır.`,`Pilze verstecken sich an schattigen Plätzen.`],[`Perfect! Take some fertiliser, your crops will go wild.`,`Mükemmel! Biraz gübre al, ekinlerin çıldıracak.`,`Perfekt! Nimm etwas Dünger, deine Pflanzen werden durchstarten.`]],
 dw1:[[`I'm Tess. Two fish for tonight's dinner? I'll trade you glowberry seeds.`,`Ben Tess. Bu akşamki yemek için iki balık? Karşılığında parlak çilek tohumu veririm.`,`Ich bin Tess. Zwei Fische fürs Abendessen? Dafür tausche ich Leuchtbeeren-Samen.`],[`Two fish. The lake is right there.`,`İki balık. Göl hemen orada.`,`Zwei Fische. Der See ist gleich da.`],[`Dinner is saved! Glowberry seeds, as promised.`,`Akşam yemeği kurtuldu! Söz verdiğim gibi parlak çilek tohumları.`,`Das Abendessen ist gerettet! Leuchtbeeren-Samen, wie versprochen.`]],
 dh1:[[`I'm Yusuf. I'm craving cactus fruit. Three would make my week. Melon seeds in return!`,`Ben Yusuf. Kaktüs meyvesine bayılıyorum. Üç tane haftamı kurtarır. Karşılığında kavun tohumu!`,`Ich bin Yusuf. Ich habe Lust auf Kaktusfrüchte. Drei machen meine Woche. Dafür gibt's Melonensamen!`],[`Cactus fruit. Watch the spines!`,`Kaktüs meyvesi. Dikenlere dikkat!`,`Kaktusfrüchte. Vorsicht, Stacheln!`],[`Sweet! Take these melon seeds, plant them near water.`,`Harika! Bu kavun tohumlarını al, suyun yakınına ek.`,`Super! Nimm diese Melonensamen und pflanze sie nahe am Wasser.`]],
 gf1:[[`I'm Ingrid. Two crystals for my lantern lens, I'll pay in frostroot seeds.`,`Ben Ingrid. Fener merceğim için iki kristal, karşılığında don kökü tohumu veririm.`,`Ich bin Ingrid. Zwei Kristalle für meine Laternenlinse, ich zahle mit Frostwurzel-Samen.`],[`Crystals glitter in caves. Try the ice cave!`,`Kristaller mağaralarda parlar. Buz mağarasını dene!`,`Kristalle glitzern in Höhlen. Probier die Eishöhle!`],[`It sparkles! Frostroot seeds, as promised.`,`Parlıyor! Söz verdiğim gibi don kökü tohumları.`,`Es funkelt! Frostwurzel-Samen, wie versprochen.`]],
 rw1:[[`I'm Cog. Rue's scrap pile is running low. Two scrap and I'll build you a circuit.`,`Ben Cog. Rue'nun hurda yığını azaldı. İki hurda getir, sana bir devre yapayım.`,`Ich bin Cog. Rues Schrotthaufen wird knapp. Bring zwei Schrott, dann baue ich dir einen Schaltkreis.`],[`Two scrap. Check the dead cars.`,`İki hurda. Ölü arabalara bak.`,`Zwei Schrott. Schau bei den toten Autos.`],[`Nice! Here's a circuit. Don't tell Rue.`,`Güzel! İşte bir devre. Rue'ya söyleme.`,`Prima! Hier ein Schaltkreis. Sag's nicht Rue.`]]};
Object.keys(SQT).forEach(id=>{const v=SQT[id];D('sq_'+id+'_q',...v[0]);D('sq_'+id+'_a',...v[1]);D('sq_'+id+'_t',...v[2])});
D('sq_new','New side quest!','Yeni yan görev!','Neue Nebenquest!');D('sq_done','Done!','Tamam!','Erledigt!');D('sq_unk','Talk to them to find out.','Öğrenmek için konuş.','Sprich mit ihnen.');
/* ============ COZVIL cutscenes ============ */
const CSW=160,CSH=90;

const CSB=(()=>{const r=mulberry(77),a=[];let x=-4;while(x<170){const w=8+Math.floor(r()*13),hh=20+Math.floor(r()*40);a.push({x,w,h:hh,s:r(),v:r()});x+=w+1}return a})();

let CSOV=null;
function nwCutscene(scenes){return new Promise(res=>{NWS.busy++;const ov=h('div','cs-ov');ov.style.cssText='position:fixed;inset:0;z-index:100000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation';ov.innerHTML='<canvas width="160" height="90" style="image-rendering:pixelated;width:min(100vw,calc((100vh - 90px)*1.7778));height:auto;aspect-ratio:16/9;background:#000"></canvas><div class="cs-cap" style="color:#fff;font:600 15px/1.35 system-ui,sans-serif;text-align:center;padding:8px 18px;min-height:60px;max-width:760px;text-shadow:0 2px 0 #000"></div><button class="btn small cs-skip" style="position:absolute;right:10px;top:10px">'+t('cs_skip')+' ▶▶</button>';document.body.appendChild(ov);CSOV=ov;const cv=ov.firstChild,g=cv.getContext('2d');g.imageSmoothingEnabled=false;const cap=ov.querySelector('.cs-cap');let i=0,t0=performance.now(),typed=0,done=false,raf;
  const fin=()=>{if(done)return;done=true;cancelAnimationFrame(raf);ov.remove();CSOV=null;NWS.busy--;res()};
  const next=()=>{const sc=scenes[i];const full=t(sc.cap);if(typed<full.length){typed=full.length;return}i++;if(i>=scenes.length)return fin();t0=performance.now();typed=0;SFX.tap&&SFX.tap()};
  ov.addEventListener('pointerdown',e=>{if(e.target.classList.contains('cs-skip'))return;next()});ov.querySelector('.cs-skip').onclick=e=>{e.stopPropagation();fin()};
  const key=e=>{if(!CSOV){removeEventListener('keydown',key);return}if(e.key==='Enter'||e.key===' '){e.preventDefault();next()}if(e.key==='Escape')fin()};addEventListener('keydown',key);
  const loop=()=>{if(done)return;const sc=scenes[i],tt=(performance.now()-t0)/1000;g.clearRect(0,0,CSW,CSH);try{sc.draw(g,tt)}catch(e){}const full=t(sc.cap);typed=Math.min(full.length,Math.max(typed,Math.floor(tt*28)));cap.textContent=full.slice(0,typed)+(typed>=full.length?'  ▸':'');if(tt>sc.dur+full.length/28&&typed>=full.length)next();raf=requestAnimationFrame(loop)};loop()})}
async function nwIntro(){S.nw=S.nw||{};NWP().intro=1;await nwCutscene(CS_INTRO)}
async function nwEnding(){const P=NWP();await nwCutscene(CS_END);qset('end');P.end=1;S.gems=(S.gems||0)+25;addCoins(500);save();nwBanner('👑 '+t('end_t'),t('end_s'));await sleep(1200);await nwSay([{w:'fenn',t:t('end_f1')},{w:'bolt',t:t('end_b1')},{w:'tilda',t:t('end_t1')},{w:'hero',t:t('end_h1')},{w:'narr',t:t('end_n1')}])}

QG('bjorn','Reach Glimmerfrost (far north-west) and meet Bjorn','Glimmerfrost\'a (uzak kuzeybatı) git, Bjorn ile tanış','Erreiche Glimmerfrost (hoher Nordwesten), triff Bjorn','Insulation & greenhouse learned!','Yalıtım ve sera öğrenildi!','Dämmung & Gewächshaus gelernt!',['You need the coat equipped to survive the snow. Bring 4 cloth.','Karda hayatta kalmak için palto gerek. 4 kumaş getir.','Im Schnee überlebst du nur mit Mantel. Bring 4 Stoffe.']);

QG('rue','Reach Rustwick (north-east) and bring Rue 3 circuits','Rustwick\'e (kuzeydoğu) git, Rue\'ya 3 devre götür','Erreiche Rustwick (Nordosten) und bring Rue 3 Schaltkreise','Rustwick relay is back!','Rustwick rölesi geri geldi!','Das Rustwick-Relais läuft wieder!',['Craft circuits from scrap and ore — you need the forge blueprint. Wear the filter mask.','Devreleri hurda ve cevherden yap — dövme planı lazım. Filtreli maske tak.','Schaltkreise baust du aus Schrott und Erz – du brauchst den Schmiede-Bauplan. Trag die Filtermaske.']);

QG('bc_meridian','Light the Great Lantern of Meridian','Meridian\'ın Büyük Fenerini yak','Entzünde die Große Laterne von Meridian','The Line is whole!','Hat bütün!','Die Linie ist vollständig!',['Needs 4 circuits, 4 solar cells, 4 crystals, 4 glass and all 6 beacons lit.','4 devre, 4 güneş hücresi, 4 kristal, 4 cam ve yanan 6 fener gerekir.','Braucht 4 Schaltkreise, 4 Solarzellen, 4 Kristalle, 4 Glas und alle 6 Leuchtfeuer.']);

D('q_free','Free play! Build, explore, farm, befriend.','Serbest oyun! İnşa et, keşfet, ek, dost edin.','Freies Spiel! Bauen, erkunden, farmen, Freunde finden.');
D('end_t','COZVIL','COZVIL','COZVIL');D('end_s','The Lantern Line is whole.','Fener Hattı bütünlendi.','Die Laternenlinie ist vollständig.');
D('end_f1','You did it. You actually did it. The whole Line is glowing!','Başardın. Gerçekten başardın. Bütün Hat parlıyor!','Du hast es geschafft. Wirklich! Die ganze Linie leuchtet!');D('end_b1','THE LANTERN IS LIT. MY FUNCTION IS COMPLETE. I WILL NOW… GARDEN.','FENER YANDI. GÖREVİM TAMAMLANDI. ŞİMDİ… BAHÇECİLİK YAPACAĞIM.','DIE LATERNE BRENNT. MEINE AUFGABE IST ERFÜLLT. ICH WERDE NUN … GÄRTNERN.');D('end_t1','Lanternrest sends its thanks — and a very large pie.','Lanternrest teşekkürlerini ve çok büyük bir turta gönderiyor.','Lanternrest schickt Dank – und einen sehr großen Kuchen.');D('end_h1','The old world is gone. But this one… I think I like this one.','Eski dünya gitti. Ama bu… Sanırım bunu seviyorum.','Die alte Welt ist weg. Aber diese hier … ich glaube, die mag ich.');D('end_n1','The story is complete — but COZVIL is yours now. Build, farm, explore, and keep the lights on.','Hikâye tamamlandı — ama COZVIL artık senin. İnşa et, ek, keşfet ve ışıkları açık tut.','Die Geschichte ist zu Ende – aber COZVIL gehört jetzt dir. Bauen, farmen, erkunden und die Lichter an lassen.');
D('cs_skip','Skip','Atla','Überspringen');
D('cs_i1','The old world never saw it coming. One night, the lights were still on.','Eski dünya bunu hiç beklemiyordu. Bir gece ışıklar hâlâ yanıyordu.','Die alte Welt sah es nicht kommen. In einer Nacht brannten noch alle Lichter.');
D('cs_i2','Then, one by one, they went out. Cities fell silent. The year was 2050.','Sonra tek tek söndüler. Şehirler sustu. Yıl 2050\'ydi.','Dann gingen sie nacheinander aus. Die Städte verstummten. Es war das Jahr 2050.');
D('cs_i3','But the world didn\'t end. It exhaled. Green crept over the concrete and birds took the skyline.','Ama dünya bitmedi. Nefes verdi. Yeşil betonu sardı, kuşlar ufku aldı.','Doch die Welt endete nicht. Sie atmete aus. Grün kroch über den Beton und Vögel nahmen die Skyline ein.');
D('cs_i4','The survivors built small villages and lit lanterns for each other — the Lantern Line. For a while, it held.','Hayatta kalanlar küçük köyler kurup birbirleri için fenerler yaktı — Fener Hattı. Bir süre dayandı.','Die Überlebenden bauten kleine Dörfer und entzündeten Laternen füreinander – die Laternenlinie. Eine Weile hielt sie.');
D('cs_i5','Now the lights are fading again. And in a quiet pod, someone is finally waking up…','Şimdi ışıklar yine sönüyor. Ve sessiz bir kapsülde biri sonunda uyanıyor…','Jetzt verlöschen die Lichter erneut. Und in einer stillen Kapsel wacht endlich jemand auf …');
D('cs_e1','One by one, the beacons answered. The Line ran from the cradle to the sea of ruins.','Fenerler tek tek karşılık verdi. Hat, beşikten harabeler denizine uzandı.','Eins nach dem anderen antworteten die Leuchtfeuer. Die Linie reichte von der Wiege bis zum Meer aus Ruinen.');
D('cs_e2','And at Meridian, the Great Lantern woke — a single light, seen from every village.','Meridian\'da Büyük Fener uyandı — her köyden görülen tek bir ışık.','Und in Meridian erwachte die Große Laterne – ein einziges Licht, von jedem Dorf aus zu sehen.');
D('cs_e3','The world wasn\'t over. It was just waiting for someone to turn on the lights. COZVIL.','Dünya bitmemişti. Sadece biri ışıkları açsın diye bekliyordu. COZVIL.','Die Welt war nicht vorbei. Sie wartete nur darauf, dass jemand das Licht anmacht. COZVIL.');

const SGN={cradle:['THE CRADLE — "Sleepers rest here. Please wake gently."','BEŞİK — "Uyuyanlar burada dinlenir. Lütfen nazikçe uyandırın."','DIE WIEGE – „Schläfer ruhen hier. Bitte sanft wecken.“'],lanternrest:['LANTERNREST — Pop. 12 and a fox. Beacon: unlit.','LANTERNREST — Nüfus 12 ve bir tilki. Fener: sönük.','LANTERNREST – Einw.: 12 und ein Fuchs. Leuchtfeuer: aus.'],lullaby:['Lullaby Lake. Fishing allowed. Singing encouraged.','Ninni Gölü. Balık tutmak serbest. Şarkı söylemek teşvik edilir.','Wiegensee. Angeln erlaubt. Singen erwünscht.'],mossgate:['MOSSGATE — Please wipe your boots. We mean it.','MOSSGATE — Lütfen botlarını sil. Ciddiyiz.','MOSSGATE – Bitte Stiefel abtreten. Wir meinen es ernst.'],driftwater:['DRIFTWATER — Mind the water. It minds you.','DRIFTWATER — Suya dikkat. O da sana dikkat ediyor.','DRIFTWATER – Achtung Wasser. Es achtet auf dich.'],meridian:['MERIDIAN — "City of Light". Closed for repairs since 2031.','MERIDIAN — "Işık Şehri". 2031\'den beri tadilatta.','MERIDIAN – „Stadt des Lichts“. Seit 2031 wegen Reparaturen geschlossen.'],dunehaven:['DUNEHAVEN — Water: yes. Shade: sometimes.','DUNEHAVEN — Su: var. Gölge: bazen.','DUNEHAVEN – Wasser: ja. Schatten: manchmal.'],glimmerfrost:['GLIMMERFROST — Coats required. Hot soup provided.','GLIMMERFROST — Palto şart. Sıcak çorba ikram.','GLIMMERFROST – Mantel Pflicht. Heiße Suppe inklusive.'],ironhold:['IRONHOLD — No loitering. No touching the anvil.','IRONHOLD — Oyalanmak yasak. Örse dokunmak yasak.','IRONHOLD – Kein Herumlungern. Amboss nicht anfassen.'],rustwick:['RUSTWICK — Filter masks at the door.','RUSTWICK — Filtreli maskeler kapıda.','RUSTWICK – Filtermasken an der Tür.'],observatory:['Observatory. Shh. Stars thinking.','Gözlemevi. Şşş. Yıldızlar düşünüyor.','Sternwarte. Pst. Sterne denken nach.'],quarry:['QUARRY — Old stone, older secrets.','TAŞ OCAĞI — Eski taş, daha eski sırlar.','STEINBRUCH – Alter Stein, ältere Geheimnisse.'],homestore:['HOMESTORE — Everything for your home!* (*some assembly required)','HOMESTORE — Evin için her şey!* (*montaj gerekebilir)','HOMESTORE – Alles fürs Zuhause!* (*Aufbau erforderlich)'],greenhouse:['GREENHOUSE — Seeds from 100 countries. Now: from one very confused tomato.','SERA — 100 ülkeden tohum. Şimdi: çok şaşkın bir domatesten.','GEWÄCHSHAUS – Samen aus 100 Ländern. Jetzt: von einer sehr verwirrten Tomate.'],gasstation:['GAS — Last stop for 400 km. (It was a joke then, too.)','BENZİN — 400 km boyunca son durak. (O zaman da şakaydı.)','TANKEN – Letzter Halt für 400 km. (Damals auch ein Witz.)'],radiotower:['RADIO TOWER — Transmitting: nothing. Yet.','RADYO KULESİ — Yayın: hiçbir şey. Henüz.','FUNKTURM – Sendet: nichts. Noch.'],shipwreck:['Shipwreck Bay. The ship was lost. So were its snacks.','Gemi Enkazı Koyu. Gemi kayboldu. Atıştırmalıkları da.','Schiffswrack-Bucht. Das Schiff ging verloren. Die Snacks auch.'],archive:['ARCHIVE — Please return books by 2031.','ARŞİV — Kitapları 2031\'e kadar iade edin.','ARCHIV – Bitte Bücher bis 2031 zurückgeben.'],oasis:['Oasis. Yes, it\'s real. Drink.','Vaha. Evet, gerçek. İç.','Oase. Ja, echt. Trink.'],scrapyard:['SCRAPYARD — Finders keepers.','HURDALIK — Bulan alır.','SCHROTTPLATZ – Wer’s findet, behält’s.']};
Object.keys(SGN).forEach(k=>D('sg_'+k,...SGN[k]));

D('bc_ok_lanternrest','The old beacon coughs, flickers… and then ROARS. Lanternrest cheers. Far away, something answers.','Eski fener öksürür, titrer… sonra GÜRLER. Lanternrest sevinçle haykırır. Uzakta bir şey karşılık verir.','Das alte Leuchtfeuer hustet, flackert … und BRÜLLT auf. Lanternrest jubelt. Weit weg antwortet etwas.');
D('bc_ok_mossgate','Mossgate\'s lantern glows green-gold. Nettle waves from a field full of mud.','Mossgate feneri yeşil-altın parlıyor. Nettle çamurlu bir tarladan el sallıyor.','Mossgates Laterne leuchtet grüngold. Nettle winkt von einem matschigen Feld.');
D('bc_ok_driftwater','Driftwater\'s lantern reflects across a hundred ripples. Odo throws his hat in the air.','Driftwater feneri yüz dalgada yansıyor. Odo şapkasını havaya atıyor.','Driftwaters Laterne spiegelt sich in hundert Wellen. Odo wirft seinen Hut in die Luft.');
D('bc_ok_dunehaven','Dunehaven blazes gold across the sand. Sahra smiles for the first time in years.','Dunehaven kumların üstünde altın gibi alev alıyor. Sahra yıllar sonra ilk kez gülümsüyor.','Dunehaven lodert golden über den Sand. Sahra lächelt zum ersten Mal seit Jahren.');
D('bc_ok_glimmerfrost','Glimmerfrost glows icy blue. Snowflakes catch the light like tiny stars.','Glimmerfrost buz mavisi parlıyor. Kar taneleri ışığı minik yıldızlar gibi yakalıyor.','Glimmerfrost leuchtet eisblau. Schneeflocken fangen das Licht wie winzige Sterne.');
D('bc_ok_rustwick','Rustwick hums, sparks, and glows. Rue does a victory dance among the scrap.','Rustwick uğuldar, kıvılcım saçar, parlar. Rue hurdaların arasında zafer dansı yapıyor.','Rustwick summt, funkt und glüht. Rue tanzt einen Siegestanz im Schrott.');
D('bc_ok_meridian','The Great Lantern roars to life. Light pours down every old street.','Büyük Fener gürleyerek canlanıyor. Işık eski her sokağa akıyor.','Die Große Laterne erwacht brüllend. Licht ergießt sich durch jede alte Straße.');

D('ht_look','Open hatch','Kapağı aç','Luke öffnen');D('ht_t','A rusted hatch. Inside: a tiny dusty bunker, a faded poster of a smiling family, and a little shiny relic.','Paslı bir kapak. İçinde: tozlu minik bir sığınak, gülen bir ailenin solmuş afişi ve küçük, parlak bir yadigâr.','Eine verrostete Luke. Darin: ein winziger staubiger Bunker, ein verblichenes Poster einer lächelnden Familie und ein kleines glänzendes Relikt.');

async function nwDungeon(o){const P=NWP(),did=o.did,D_=DG[did];if(!D_)return;P.cd=P.cd||{};const cdk='dg_'+did;
 if(P.cd[cdk]>Date.now()){await nwSay([{w:'narr',t:t('dg_rest')}]);return}
 if(troopTotal()<1){await nwSay([{w:'narr',t:t('dg_notroops')}]);return}
 const go=await nwSay([{w:'narr',t:t('dg_'+did)}],{choices:[{t:'⚔️ '+t('dg_enter'),v:1},{t:t('hs_bye'),v:0}]});if(go!==1&&go!==true&&!(go&&go.v===1))return;
 NWS.busy++;let won=false;
 try{const reg=NWREG[D_.b]||'hollow';P.cnt.dun=(P.cnt.dun||0)+1;
  for(let i=0;i<D_.rooms;i++){const last=i===D_.rooms-1;const mo=monsterFor(reg);mo.pw*=D_.k*(1+i*.12)*(last?1.25:1);mo.army=genArmyOfPower(mo.pw);if(last)mo.name=t('dg_'+did+'_boss');
   await nwSay([{w:'narr',t:t(last?'dg_boss':'dg_room'+(i%3),{n:i+1,m:D_.rooms})}]);
   const w=await dgFight('🗝️ '+t('ns_'+did)+' '+(i+1)+'/'+D_.rooms,mo,NWTERR[D_.b]||'mountain',(i+1)*17+did.length);if(!w){await nwSay([{w:'narr',t:t('dg_retreat')}]);return}
   if(!last&&i===0){const l=makeLoot(reg,1);applyLoot(l,{},0)}}
  won=true;const r=D_.rw;roGive(null,r.inv,r.gems,r.coins);P.cd[cdk]=Date.now()+20*60000;
  await nwSay([{w:'narr',t:t('dg_win')}]);nwEvt('dungeon',did);roQ2('dungeon');if(typeof nwAch==='function')nwAch()}
 finally{NWS.busy--}}
